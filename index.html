"제6부 신규 제작 요약 이미지 개정본입니다. 민트·청록색 구성을 유지하고 비급여의 전액 부담과 급여의 전액본인부담을 비교했습니다. 금액은 교육용 가정이며 실제 부담률이나 보험금 지급을 뜻하지 않습니다.","1-6-2":"이미지 1은 장 전체 요약, 이미지 2는 가상 영수증을 해석하는 추가 장표입니다. 두 이미지 모두 교육용으로 제작했으며 추가 장표는 실제 발급 영수증이 아닙니다. 숫자·비용 분류는 가정이며 실제 부담률·수가·보험금 지급액을 뜻하지 않습니다.","1-6-3":"제6부 민트·청록색 신규 요약 이미지입니다. 서류별 역할을 설명하는 일반 학습용 자료이며 모든 회사·상품의 공통 필수서류 목록이 아닙니다. 제출서류와 대체 가능 여부는 최신 청구 안내로 확인하세요.","1-6-4":"제6부 민트·청록색 신규 요약 이미지입니다. 날짜는 결과보고 시점을 정한 약관과 진단요건 충족을 가정한 교육용 사례입니다. 모든 계약에 같은 기준일을 적용하거나 지급을 확정하는 자료가 아닙니다.","1-6-5":"제6부의 민트·청록색 신규 요약 이미지입니다. 진료 경로는 일반적인 이해를 위한 예이며 실제 절차·비용 산정은 상황별로 다를 수 있습니다. 건강보험 산정과 민영보험 지급요건을 구분하며 사례는 지급을 확정하지 않습니다.","1-6-6":"제6부 종합 실습을 위해 새로 제작한 민트·청록색 요약 이미지입니다. 인물·날짜·금액은 모두 가정이며 실제 수가·부담률·치료과정이나 보험금 지급을 뜻하지 않습니다. 다른 정산 조정이 없다고 가정한 계산입니다.","1-7-1":"제7부는 연보라색 배경과 짙은 보라색 제목으로 새로 제작했습니다. 이미지의 보험증권·판본·금액·기간은 모두 교육용 가상 표기이며 실제 상품이나 변경 후 적용 조건을 뜻하지 않습니다. 가입 내용과 적용 약관은 실제 문서로 확인하세요.","1-7-2":"제7부의 연보라색 신규 요약 이미지입니다. 가상 사례는 조항을 읽는 방법을 설명하며 특정 수술의 보장·제외나 보험금 지급·부지급을 확정하지 않습니다. 적용 약관과 실제 사실관계를 함께 확인하세요."}};
const app=document.getElementById('app'),crumb=document.getElementById('crumb');
let route=[];let memoryProgress={};
function state(){try{const a=JSON.parse(localStorage.getItem('encyclopedia_progress')||'{}');const b=JSON.parse(localStorage.getItem('medCompleted')||'{}');for(const [k,v]of Object.entries(b)){const m=k.match(/^v(\d+)p(\d+)c(\d+)$/);if(m&&a[m.slice(1).join('-')]===undefined)a[m.slice(1).join('-')]=v}return {...a,...memoryProgress}}catch{return memoryProgress}}
function mark(id,checked){const s=state();s[id]=checked;memoryProgress=s;try{localStorage.setItem('encyclopedia_progress',JSON.stringify(s))}catch{}render()}
function el(t,cls,txt){const x=document.createElement(t);if(cls)x.className=cls;if(txt!==undefined)x.textContent=txt;return x}
function btn(txt,fn,cls='btn'){const x=el('button',cls,txt);x.type='button';x.onclick=fn;return x}
function go(...a){location.hash=a.join('/');if(location.hash.slice(1)===a.join('/'))readRoute();window.scrollTo(0,0)}
function readRoute(){const a=location.hash.slice(1).split('/').filter(Boolean).map(Number);route=a.length<=3&&a.every((n,i)=>Number.isInteger(n)&&n>=1&&n<=[6,10,6][i])?a:[];render();document.getElementById('screen-state')?.focus({preventScroll:true});window.scrollTo(0,0)}
function tile(title,sub,fn){const x=btn('',fn,'tile');x.dataset.pending=String(/준비|^0 \/ /.test(sub));x.append(el('strong','',title),el('small','',sub));return x}
function count(v,p){return Object.keys(DATA.chapters).filter(k=>k.startsWith(`${v}-`+(p?`${p}-`:''))).length}
function progress(parent,n,total,label){const b=el('div','progress'),i=el('i');i.style.width=`${Math.min(100,n/total*100)}%`;b.setAttribute('role','progressbar');b.setAttribute('aria-label',label);b.setAttribute('aria-valuenow',n);b.setAttribute('aria-valuemax',total);b.append(i);parent.append(b)}
function breadcrumb(){crumb.replaceChildren(btn('전체 도서관',()=>go()));route.forEach((n,i)=>{crumb.append(document.createTextNode('›'),btn(`제${n}${['권','부','장'][i]}`,()=>go(...route.slice(0,i+1))))})}
function chapterRow(id){const x=DATA.chapters[id],a=id.split('-').map(Number),b=btn('',()=>go(...a),'row'),t=el('div');t.append(el('b','',`제${a[1]}부 제${a[2]}장 · ${x[0]}`));b.append(t,el('span','badge',(state()[id]?'✓ 학습 완료 · ':'')+x[2]));return b}
function updateScreen(){
 const levels=['home','volume','part','chapter'],labels=['권 선택','부 선택','장 선택','교재 읽기'];
 const level=route.length,[v,p,c]=route;
 document.body.dataset.screen=levels[level];
 const last=crumb.querySelector('button:last-child');if(last)last.setAttribute('aria-current','page');
 let box=document.getElementById('screen-state');
 if(!box){box=el('section','screen-state');box.id='screen-state';box.tabIndex=-1;box.setAttribute('aria-label','현재 화면 안내');app.before(box);}
 box.replaceChildren();
 const top=el('div','screen-location'),location=el('div');
 const titles=['전체 도서관 · 권 선택',`제${v}권 목차 · 부 선택`,`제${v}권 제${p}부 · 장 선택`,`제${v}권 제${p}부 제${c}장 · 교재 읽기`];
 location.append(el('p','screen-kicker',`${level+1} / 4 단계 · 현재 화면`),el('p','screen-title',titles[level]));top.append(location);
 if(level)top.append(btn('← 이전 화면',()=>go(...route.slice(0,-1)),'screen-back'));
 box.append(top);const steps=el('ol','screen-steps');steps.setAttribute('aria-label','교재를 여는 순서');
 labels.forEach((label,i)=>{const step=el('li',i===level?'active':i<level?'complete':'');if(i===level)step.setAttribute('aria-current','step');step.append(el('span','step-number',i<level?'✓':String(i+1)),el('span','',label));steps.append(step);});box.append(steps);

function render(){breadcrumb();app.replaceChildren();updateScreen();const [v,p,c]=route;document.title=(c?DATA.chapters[`${v}-${p}-${c}`]?.[0]||'자료 준비 중':'보험인을 위한 질병 대백과사전');if(!v){const h=el('section','hero');h.append(el('div','eyebrow','MEDICAL & INSURANCE LIBRARY'),el('h1','','지식을 쌓고, 실무로 연결해.'),el('p','muted','제1권부터 제6권까지, 권 → 부 → 장 순서로 공부하는 나만의 도서관.'));const stats=el('div','stats'),done=Object.keys(DATA.chapters).filter(k=>state()[k]).length;for(const [n,l]of [['38 / 360','현재 집필 현황 · 10.56%'],['38장','현재 열람 가능'],[`${done} / 38`,'내가 학습한 장']]){const s=el('div','stat');s.append(el('b','',n),el('span','',l));stats.append(s)}h.append(stats);progress(h,38,360,'현재 집필 현황');h.append(el('p','muted','현재 제1권 제7부 제2장까지 · 본문·실무 사례·확인 문제 38장 · 다음은 제7부 제3장'));h.append(btn('마지막 집필 장 바로 읽기 →',()=>go(1,7,2),'btn primary'));app.append(h,el('h2','','전체 6권'));const g=el('div','grid');DATA.volumes.forEach((t,i)=>g.append(tile(`제${i+1}권 · ${t}`,`${count(i+1)} / 60장 열람 가능`,()=>go(i+1))));app.append(g,el('h2','','장 제목으로 바로 찾기'));const input=el('input','searchbox');input.type='search';input.placeholder='예: 뇌와 신경, 혈액검사, 질병코드';input.setAttribute('aria-label','장 제목 검색');const results=el('div','list');input.oninput=()=>{results.replaceChildren();const q=input.value.trim();if(!q)return;const matches=Object.keys(DATA.chapters).filter(k=>DATA.chapters[k][0].includes(q));matches.forEach(k=>results.append(chapterRow(k)));if(!matches.length)results.append(el('p','empty','검색 결과가 없어. 다른 장 제목으로 찾아봐.'))};app.append(input,results);const note=el('div','notice');note.append(el('b','','이번에 집필한 내용'),el('p','','제7부 제2장 지급사유와 지급하지 않는 사유를 추가했어. 38장 본문과 함께 제7부의 연보라색 요약 이미지를 읽을 수 있어.'));app.append(note);return}
if(!p){app.append(el('h1','',`제${v}권 · ${DATA.volumes[v-1]}`),el('p','muted',`${count(v)} / 60장 열람 가능`));const g=el('div','grid');for(let j=1;j<=10;j++)g.append(tile(`제${j}부 · ${DATA.parts[v]?.[j]||'세부 목차 확인 중'}`,`${count(v,j)} / 6장 열람 가능`,()=>go(v,j)));app.append(g);return}
if(!c){app.append(el('h1','',`제${v}권 제${p}부 · ${DATA.parts[v]?.[p]||'세부 목차 확인 중'}`));const list=el('div','list');for(let j=1;j<=6;j++){const id=`${v}-${p}-${j}`;list.append(DATA.chapters[id]?chapterRow(id):tile(`제${j}장 · 자료 준비 중`,'기존 원본 확인 후 연결 예정',()=>go(v,p,j)))}app.append(list);return}
const id=`${v}-${p}-${c}`,x=DATA.chapters[id],card=el('article','reader');app.append(card);if(!x){card.append(el('h1','','자료 준비 중'),el('p','muted','이 장은 아직 집필 자료가 연결되지 않았어.'));navigation(card,v,p,c);return}
const hero=el('div','hero');hero.append(el('div','eyebrow',`제${v}권 · 제${p}부 · 제${c}장`),el('h1','',x[0]),el('span','badge',x[2]));card.append(hero);const actions=el('div','actions');actions.append(btn('인쇄 / PDF 저장',()=>window.print()));const editLink=el('a','btn','이 장 수정');editLink.href='editor.html#'+id.replaceAll('-','/');actions.append(editLink);const file=DATA.downloads[id];if(file){const a=el('a','btn primary',file.mime==='application/pdf'?'원본 PDF 다운로드':'원본 PPT 다운로드');a.download=file.name;a.href=file.url||`data:${file.mime};base64,${file.data}`;actions.append(a)}card.append(actions,el('p','notice',x[3]));if(DATA.lessons?.[id]){const lesson=DATA.lessons[id];card.append(el('h2','','학습 본문'));for(const section of lesson.sections){const block=el('section','sheet');block.append(el('h3','',section.heading));section.paragraphs.forEach(t=>block.append(el('p','',t)));card.append(block)}const quiz=el('section','sheet');quiz.append(el('h3','','학습 확인'),el('p','',lesson.question));const answer=el('details'),summary=el('summary','','해설 보기');answer.append(summary,el('p','',lesson.answer));quiz.append(answer);card.append(quiz);const refs=el('details','sheet');refs.append(el('summary','','참고 자료 · 의학 개념 및 분류 기준'));lesson.references.forEach(url=>{const p=el('p');const a=el('a','',new URL(url).hostname);a.href=url;a.target='_blank';a.rel='noopener noreferrer';p.append(a);refs.append(p)});refs.append(el('p','muted','의학 개념과 분류 기준을 확인한 참고 자료야. 가상 사례와 보험 실무 해설은 학습용으로 작성했으며 특정 상품의 지급을 확정하지 않아.'));card.append(refs)}if(DATA.texts[id]?.length){card.append(el('h2','','함께 읽기 · 기존 교재 본문'));for(const s of DATA.texts[id]){const section=el('section','sheet');section.append(el('div','pagecount',`원본 교재 ${s.page}쪽`));s.lines.forEach((t,i)=>section.append(el(i===0?'h3':'p','',t)));card.append(section)}}if(DATA.assets[id]?.length){const jump=btn('요약 이미지 바로 보기',()=>document.getElementById('chapter-images')?.scrollIntoView({behavior:'smooth'}));card.insertBefore(jump,card.firstChild);const imageAnchor=el('div','');imageAnchor.id='chapter-images';card.append(imageAnchor);card.append(el('p','muted',DATA.assets[id]?.some(src=>src.startsWith('assets/generated-summaries/'))?'이 장에 맞춰 새로 제작한 요약 이미지야. 설명 본문과 가상 사례를 함께 읽어 줘.':'아래 이미지는 기존 제작 자료야. 이미지 안 진행률은 당시 기록이며 현재 집필 진도는 첫 화면을 확인해 줘. 질병코드 세부 분류는 해당 판본을 확인해.'));card.append(el('h2','','핵심 요약 이미지'));if(DATA.image_notes?.[id])card.append(el('p','notice',DATA.image_notes[id]));const zoom=el('div','zoom');const imageItems=(DATA.assets[id]||[]).map((src,i)=>({src,title:x[0]+' · 이미지 '+(i+1)}));card.append(btn('이미지 크게 보기',()=>TextbookImageViewer.open(imageItems,0)));card.append(el('p','muted','아래 사진을 누르면 전체 화면으로 열립니다. 사진이 여러 장이면 확대 화면에서 좌우로 넘길 수 있습니다.'));(DATA.assets[id]||[]).forEach((src,i)=>{const img=el('img');img.src=src;img.loading='lazy';img.alt=`${x[0]} · ${i+1}페이지`;img.tabIndex=0;img.setAttribute('role','button');img.setAttribute('aria-label',x[0]+' · 이미지 '+(i+1)+' 크게 보기');img.onclick=()=>TextbookImageViewer.open(imageItems,i);img.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();TextbookImageViewer.open(imageItems,i)}};zoom.append(img)});card.append(zoom);if(DATA.sources[id])card.append(el('p','muted','연결 자료: '+DATA.sources[id]));}const label=el('label','check'),check=el('input');check.type='checkbox';check.checked=!!state()[id];check.onchange=()=>mark(id,check.checked);label.append(check,document.createTextNode('이 장 학습 완료'));card.append(label);navigation(card,v,p,c)}
function navigation(parent,v,p,c){const n=(v-1)*60+(p-1)*6+c-1,nav=el('div','chapter-nav');function at(i){return [Math.floor(i/60)+1,Math.floor(i%60/6)+1,i%6+1]}if(n>0){const a=at(n-1);nav.append(btn('← 이전 장',()=>go(...a)))}if(n<359){const a=at(n+1);nav.append(btn('다음 장 →',()=>go(...a)))}parent.append(nav)}
