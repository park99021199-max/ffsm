lines":["01 | 심장은 어떤 장기인가?","심장의 핵심 기능","심장은 근육으로 이루어진 펌프다. 수축과 이완을 반복하여 혈액을 폐와 온몸으로 보낸다.","심장 자체도 관상동맥을 통해 산소와 영양분을 공급받는다.","우심방","좌심방","우심실","좌심실","↓","↓","오른쪽 심장 → 폐로 혈액 전달","왼쪽 심장 → 전신으로 혈액 전달"]},{"page":3,"lines":["02 | 혈액은 어느 방향으로 흐를까?","온몸","산소를 사용한 혈액","→","우심장","폐로 혈액을 보냄","→","폐","산소를 받아들임","→","좌심장","전신으로 혈액을 보냄","→","온몸","산소·영양분 공급","폐순환","우심실 → 폐동맥 → 폐 모세혈관 → 폐정맥 → 좌심방","체순환","좌심실 → 대동맥 → 전신 조직 → 대정맥 → 우심방","주의: 동맥·정맥은 산소량이 아니라 심장에서 나가는지/들어오는지로 구분한다."]},{"page":4,"lines":["03 | 혈관의 세 종류","동맥","심장에서 나가는 혈액의 통로. 높은 압력을 견디는 두꺼운 혈관벽을 가진다.","대표 문제: 동맥경화·협착·폐색·동맥류","정맥","심장으로 돌아오는 혈액의 통로. 일부 정맥에는 역류를 방지하는 판막이 있다.","대표 문제: 심부정맥혈전증·정맥류","모세혈관","혈액과 조직 사이에서 산소·영양분·노폐물 교환이 이루어지는 매우 가는 혈관.","대표 문제: 미세혈관 손상"]},{"page":5,"lines":["04 | 관상동맥은 왜 중요할까?","관상동맥의 역할","심장근육도 살아 있는 조직이므로 산소가 필요하다. 관상동맥은 심근에 산소가 포함된 혈액을 공급한다.","관상동맥이 좁아지면 심근 허혈이, 혈류가 심하게 차단되어 심근괴사가 발생하면 심근경색이 생길 수 있다.","정상 혈관","혈액 흐름 원활","→","혈관 협착","산소 공급 감소","→","급성 폐색","심근 손상 위험","보험 포인트: 협심증 ≠ 급성심근경색증","진단명·검사결과·약관상 정의를 각각 확인"]},{"page":6,"lines":["05 | 심장은 전기신호로 박동한다","동방결절","박동 신호 시작","→","방실결절","전기신호 전달 조절","→","히스속·푸르키녜","심실로 신호 전달","→","심실 수축","혈액을 내보냄","부정맥과의 연결","전기신호의 발생·전달이 비정상적이면 빈맥, 서맥, 심방세동 등 다양한 부정맥이 생길 수 있다.","부정맥은 종류와 지속시간, 위험도가 서로 다르며 진단에는 심전도 등의 자료가 중요하다."]},{"page":7,"lines":["06 | 혈압은 어떻게 만들어질까?","혈압의 기본 원리","혈압은 혈액이 혈관벽에 가하는 압력이다.","심박출량, 혈관 저항, 혈액량, 혈관 탄성 등이 혈압에 영향을 준다.","수축기·이완기 혈압","수축기 혈압: 심실이 수축해 혈액을 내보낼 때의 압력","이완기 혈압: 심장이 이완하는 동안의 동맥 압력","고혈압은 장기간 심장·뇌·신장·혈관에 부담을 줄 수 있다."]},{"page":8,"lines":["07 | 혈전·색전·출혈·경색의 차이","혈전 (Thrombus)","혈관 안에서 혈액이 응고되어 생긴 덩어리.","색전 (Embolus)","혈전 등의 물질이 이동해 다른 혈관을 막는 현상과 관련.","출혈 (Hemorrhage)","혈관에서 혈액이 빠져나오는 현상.","경색 (Infarction)","혈류 장애로 조직이 괴사한 상태. 뇌경색·심근경색 등이 대표적."]},{"page":9,"lines":["08 | 심장·혈관질환 비교","협심증","심근 허혈에 의한 증상·질환","심전도·부하검사·관상동맥 평가","심근경색","급성 심근손상과 허혈의 증거","트로포닌·심전도·영상 등 종합","심부전","심장의 펌프·충만 기능 장애","증상·심초음파·BNP 등","부정맥","심장 전기활동의 이상","심전도·홀터검사 등","뇌경색","뇌혈류 장애에 의한 뇌조직 경색","뇌영상·신경학적 평가","뇌출혈","뇌혈관 출혈","뇌CT·MRI 등"]},{"page":10,"lines":["09 | 대표 검사와 검사에서 확인하는 것","심전도 (ECG)","심장 전기활동을 기록한다. 부정맥·허혈 관련 변화 등을 평가한다.","심장초음파","심장 구조·판막·수축기능·심박출률 등을 평가한다.","트로포닌","심근손상의 혈액표지자. 상승만으로 심근경색을 단정할 수 없다.","혈관조영술·CT","관상동맥 등의 협착·폐색과 혈관 구조를 평가한다."]},{"page":11,"lines":["10 | 질병이 치료로 이어지는 과정","증상 발생","흉통·호흡곤란 등","→","응급 평가","활력징후·심전도","→","진단검사","혈액·영상검사","→","치료 결정","약물·중재·수술","→","추적관리","재활·약물·예방","의료비 분석 방법","총진료비를 검사·시술·재료·입원·약제·재활 등으로 나누고, 급여·비급여·환자 본인부담을 별도로 확인한다.","비용은 질병 중증도·병원·치료법·급여기준에 따라 달라지므로 단일 금액을 임의로 제시하지 않는다."]},{"page":12,"lines":["11 | 보험 실무 연관 — 어떤 담보를 확인할까?","진단비","급성심근경색증·허혈성심장질환·뇌혈관질환·부정맥 등: 약관상 질병정의와 분류표 확인","수술비·치료비","관상동맥중재술·우회술·혈전용해·혈전제거 등: 해당 시술이 약관의 수술·치료 정의에 해당하는지 확인","입원·중증치료","입원일당·중환자실·ECMO 등: 입원 장소, 치료 내용, 일수와 지급요건 확인","후유장해·간병","뇌졸중 후 마비 등: 후유장해 기준과 장기요양등급·간병보험 지급조건은 별개로 판단"]},{"page":13,"lines":["12 | 보험 실무 사례 — 진단명만으로 단정하지 않기","사례 A · 가슴통증 후 스텐트 삽입","관상동맥 협착으로 스텐트를 삽입했다고 해서 급성심근경색 진단비가 자동 지급되는 것은 아니다.","확정진단, 검사 소견, 약관상 지급사유를 함께 확인한다.","사례 B · 뇌경색 후 마비와 돌봄 필요","뇌경색 진단비, 치료비, 후유장해, 간병·장기요양 관련 보장은 각각 지급요건이 다르다.","장기요양등급은 진단명만으로 자동 부여되지 않고 공적 인정절차를 거친다."]},{"page":14,"lines":["13 | 한 장으로 핵심 요약","의학 핵심","① 심장 = 혈액을 보내는 펌프","② 우심장 = 폐순환, 좌심장 = 체순환","③ 동맥·정맥 = 혈액의 이동 방향으로 구분","④ 관상동맥 폐색은 심근경색의 주요 원인","⑤ 혈전·색전·출혈·경색은 다른 개념","보험 실무 핵심","① 협심증과 심근경색을 구별","② 검사 이상과 확정진단을 구별","③ 진단비와 치료비 지급요건을 각각 확인","④ 치료비는 실제 진료비 내역으로 확인","⑤ 후유장해·장기요양은 별도 기준으로 판단"]},{"page":15,"lines":["14 | 학습 확인 · 다음 장 연결","확인 질문","Q1. 폐동맥은 왜 산소가 적은 혈액을 운반할까?","Q2. 협심증과 심근경색은 무엇이 다를까?","Q3. 트로포닌이 높으면 무조건 심근경색일까?","Q4. 스텐트 시술을 받으면 어떤 약관 항목을 확인해야 할까?","다음 학습","제1부 제3장","「뇌와 신경 — 뇌의 영역별 기능·신경전달·마비」","이번 장에서 배운 혈액순환과 혈관 폐색의 원리가 뇌경색·뇌출혈·신경학적 후유증으로 연결된다."]}],"1-1-3":[{"page":1,"lines":["뇌와 신경","뇌의 영역별 기능 · 신경전달 · 마비"]},{"page":2,"lines":["신경계의 큰 구분","중추신경계: 뇌와 척수","말초신경계: 뇌·척수와 온몸을 연결","운동·감각·자율신경은 서로 다른 기능을 담당"]},{"page":3,"lines":["뇌의 주요 영역","대뇌: 운동·감각·언어·기억·판단","소뇌: 균형·운동의 정밀 조절","뇌간: 의식·호흡·심혈관 기능에 관여","척수: 뇌와 신체 사이 신호 전달"]},{"page":4,"lines":["신경신호의 원리","신경세포는 전기적 신호(활동전위)를 전달","시냅스에서는 신경전달물질로 다음 세포에 신호 전달","운동 명령과 감각 정보는 서로 다른 경로로 이동"]},{"page":5,"lines":["뇌 손상과 마비","대뇌 운동경로 손상: 반대쪽 신체에 마비가 나타날 수 있음","언어중추 손상: 실어증 가능","소뇌 손상: 운동실조·균형장애 가능","뇌간 손상: 의식·호흡 장애 등 중증 증상 가능"]},{"page":6,"lines":["대표 질병과 KCD","뇌경색: I63 / 뇌내출혈: I61","지주막하출혈: I60 / 뇌전증: G40","파킨슨병: G20 / 알츠하이머병: G30","코드·확정진단·약관상 분류표는 각각 확인"]},{"page":7,"lines":["검사와 치료","CT·MRI: 병변 위치와 성격 평가","뇌파검사: 발작 질환 평가에 활용","뇌경색: 환자별 적응증에 따라 재관류치료 고려","뇌출혈: 혈압관리·중환자치료·필요시 수술"]},{"page":8,"lines":["후유증과 장기요양","편마비·연하장애·언어장애·인지장애 등이 남을 수 있음","재활치료·보조기구·가족 돌봄이 필요할 수 있음","장기요양등급은 실제 일상생활 도움 필요도 등을 평가"]},{"page":9,"lines":["보험 실무 연결","뇌출혈·뇌졸중·뇌혈관질환 진단비의 범위 차이","혈전용해·혈전제거 등 치료비 특약의 지급조건","후유장해: 별도의 장해분류표·평가요건","재가급여·시설급여: 공적 인정과 민영 약관 조건 구분"]},{"page":10,"lines":["실전 사례","뇌경색 진단 → 급성기 치료 → 편마비 잔존 → 재활","① 진단비: 약관상 진단 요건 확인","② 치료비: 실제 시행 치료와 지급조건 확인","③ 후유장해: 평가시기·장해상태 확인","④ 간병: 장기요양 인정 및 급여 이용 여부 확인"]},{"page":11,"lines":["핵심 요약","뇌의 손상 위치에 따라 증상이 다르다.","질병 진단과 기능장애는 별도로 평가한다.","치료·재활·장기요양은 이어질 수 있지만 자동 지급은 아니다.","보험금은 계약별 약관·분류표·지급요건으로 판단한다."]}],"1-1-4":[{"page":1,"lines":["폐와 호흡기 — 산소공급·이산화탄소 배출·호흡부전","호흡기의 구조 → 질병 → 검사·치료 → 의료비 → 보험담보","의학적 사실과 보험약관상 지급조건은 구분해서 이해합니다."]},{"page":2,"lines":["01  호흡기의 구조와 역할","상기도","코·비강·인두·후두: 공기 여과, 가온·가습 및 기도 보호","하기도","기관·기관지·세기관지: 폐포까지 공기를 전달","폐포","산소가 혈액으로, 이산화탄소가 폐포로 이동하는 가스교환 부위","횡격막","수축하면 흉강이 넓어져 들숨이 일어나고 이완하면 날숨을 돕는다"]},{"page":3,"lines":["02  숨을 쉬는 원리","환기(ventilation)","공기가 폐 안팎으로 이동하는 과정. 기도 폐쇄나 호흡근 약화 시 저하될 수 있다.","확산(diffusion)","폐포와 모세혈관 사이에서 산소·이산화탄소가 농도차에 따라 이동한다.","관류(perfusion)","폐 모세혈관을 통해 혈액이 흐르는 과정. 폐색전증 등에서 장애가 생길 수 있다.","산소화와 환기는 다르다","산소포화도는 산소화의 단서이며, CO₂ 배출 장애는 동맥혈가스검사 등으로 평가한다."]},{"page":4,"lines":["03  폐렴·천식·COPD 비교","폐렴 J12–J18 등","감염 등에 의해 폐 실질에 염증 발생. 발열·기침·가래·호흡곤란. 원인에 따라 항생제 등 치료.","천식 J45 등","기도의 만성 염증과 가변적 기류제한. 천명·기침·호흡곤란. 흡입치료가 중요.","COPD J44 등","지속적 기류제한과 호흡기 증상. 흡연 등 위험인자, 폐기능검사로 진단 평가.","핵심 차이","폐렴은 폐 조직의 염증, 천식·COPD는 주로 기도의 문제. 서로 동반될 수도 있다.","코드는 대표 예시이며 세부 진단명과 실제 KCD 분류 확인이 필요합니다."]},{"page":5,"lines":["04  호흡부전은 어떤 상태인가?","산소화 장애","폐에서 혈액으로 산소를 충분히 공급하지 못하는 상태. 저산소혈증이 나타날 수 있다.","환기 장애","이산화탄소를 충분히 배출하지 못해 고탄산혈증이 발생할 수 있다.","급성 vs 만성","급성은 신속한 처치가 필요할 수 있고, 만성은 장기적 산소·호흡 보조가 필요할 수 있다.","보험 관점","호흡부전(J96 등) 진단과 산소치료·인공호흡기 사용은 서로 다른 사실. 특약별 지급사유를 각각 확인한다."]},{"page":6,"lines":["05  주요 검사와 진단 과정","흉부 X-ray·CT","폐렴·폐기종·폐섬유화·종괴 등의 영상학적 평가","폐기능검사","폐활량과 기류제한 평가. 천식·COPD 진단에 중요","산소포화도(SpO₂)","비침습적으로 산소화 상태를 확인하는 선별·모니터링 지표","동맥혈가스검사(ABGA)","PaO₂·PaCO₂·pH 등을 확인해 산소화·환기·산염기 상태 평가"]},{"page":7,"lines":["06  대표 치료법과 치료 흐름","약물치료","원인에 따라 항생제·기관지확장제·흡입스테로이드 등 사용","산소치료","저산소혈증 등 적응증에 따라 산소 공급; 모든 호흡기 환자에게 필요한 것은 아님","비침습적 환기·인공호흡기","호흡부전의 양상·중증도에 따라 적용. 기도삽관이 필요할 수도 있음","수술·중재치료","기흉 흉관삽입, 폐 종양 수술 등 질환과 상태에 따라 시행"]},{"page":8,"lines":["07  치료비를 읽는 방법","총진료비","검사·처치·약제·입원료·재료대 등의 합계. 병원·중증도·치료기간에 따라 차이","건강보험 급여","공단부담금과 법정 본인부담금으로 나누어 확인","비급여","건강보험 적용 밖의 비용. 항목별로 실손 보장 여부가 다를 수 있음","실제 환자 부담","본인부담금 + 비급여 − 해당 제도에 따른 지원·환급 등을 구분하여 계산","비용은 개별 진료비 영수증·세부내역서 또는 기준연도가 명시된 공식 통계로 확인해야 합니다."]},{"page":9,"lines":["08  호흡기 질병코드와 보장담보","폐렴","J12–J18 등. 입원일당·실손·특정질병 담보 등 가입 약관 확인","COPD·천식","J44·J45 등. 진단 자체와 특정치료 시행을 구분","호흡부전","J96 등. 중환자실·인공호흡기·특정치료비 담보 지급요건 확인","폐암","C34 등. 암진단비·수술비·주요치료비 등 해당 계약 약관 확인","동일 질병코드라도 상품별 질병분류표·면책·지급횟수가 달라질 수 있습니다."]},{"page":10,"lines":["09  실전 사례 — COPD 급성악화","상황","70세 남성, 기존 COPD 환자가 호흡곤란 악화로 응급실 방문","검사","산소포화도·혈액가스·영상검사·감염 여부 등 평가","치료","상태에 따라 기관지확장제, 전신 스테로이드, 산소치료, 환기보조 및 입원","보험금 확인","입원일당, 실손, 특정치료비, 간병 관련 특약의 요건을 각각 대조","가상의 교육용 사례입니다. 치료 내용 및 보험금 지급은 실제 상태·계약에 따라 다릅니다."]},{"page":11,"lines":["10  보험 실무 체크리스트","진단","정확한 확정진단명·KCD 코드·진단 근거 확인","치료","입원·중환자실·산소치료·인공호흡기·수술 여부 구분","비용","영수증·세부내역서에서 급여·비급여·환자부담 분리","약관","질병분류표·지급사유·면책·지급횟수·증빙서류 확인"]},{"page":12,"lines":["11  핵심 요약","폐의 역할","산소를 혈액으로 공급하고 이산화탄소를 배출한다.","질병 구분","폐렴(폐 조직 염증), 천식·COPD(기도), 호흡부전(가스교환·환기 장애)","검사·치료","영상·폐기능·산소포화도·ABGA 결과와 실제 치료를 함께 읽는다.","보험 실무","진단비·입원일당·수술비·특정치료비·간병비는 각각의 약관으로 판단한다."]}],"1-1-1":[],"1-1-5":[],"1-1-6":[],"1-2-1":[],"1-2-2":[],"1-2-3":[],"1-2-4":[],"1-2-5":[],"1-2-6":[],"1-3-1":[],"1-3-2":[],"1-3-3":[],"1-3-4":[],"1-3-5":[],"1-3-6":[],"1-4-1":[],"1-4-2":[],"1-4-3":[],"1-4-4":[],"1-4-5":[],"1-4-6":[],"1-5-1":[],"1-5-2":[],"1-5-3":[],"1-5-4":[],"1-5-5":[],"1-5-6":[]},"downloads":{},"updated":"2026-11-15","version":"2026-11-15-user-selected-originals","lessons":{"1-1-1":{"sections":[{"heading":"이 장에서 배울 핵심","paragraphs":["인체의 기본 구성은 질병을 이해하는 가장 기본적인 지도다. 이 장에서는 세포 → 조직 → 장기 → 기관계의 순서를 따라 몸의 구조를 살펴보고, 의학적 원리와 대표 질환, 진단·치료, 보험담보를 어떻게 연결해 읽을지 익힌다.","학습 목표는 네 가지다. 첫째, 세포·조직·장기·기관계의 차이를 이해한다. 둘째, 심장·폐·신장·뇌 등 장기들의 역할과 협력 관계를 설명한다. 셋째, 구조 손상과 장기 기능 저하를 구별한다. 넷째, 진단명·검사결과·치료 사실·약관상 지급요건을 각각 확인하는 습관을 익힌다."]},{"heading":"인체를 이해하는 네 단계","paragraphs":["몸을 이루는 최소 생활 단위는 세포다. 비슷한 기능을 수행하는 세포와 세포외기질이 조직을 이루고, 여러 조직이 모이면 장기, 여러 장기가 협력하면 기관계가 된다. 심장근육세포·심근조직·심장·순환계를 차례로 연결하면 구조가 보인다.","세포는 생명활동의 기본 단위다. 조직은 비슷한 기능을 하는 세포와 세포외기질이 모여 이루어지며, 장기는 여러 조직이 결합해 특정 기능을 수행하는 구조다. 기관계는 여러 장기가 협력하여 하나의 생리 기능을 수행하는 체계다. 예를 들어 심장근육세포가 심근조직을 이루고, 심근조직을 포함한 여러 조직이 심장을 구성하며, 심장은 혈관 등과 함께 순환계에서 일한다."]},{"heading":"세포가 손상되면 어떤 일이 생길까?","paragraphs":["관상동맥의 혈류가 차단되면 심장근육세포가 손상될 수 있다. 이때 트로포닌 상승은 심근손상을 의심하고 평가하는 단서가 된다. 그러나 트로포닌 수치 하나만으로 심근경색을 확정하지는 않는다. 검사 이상이 있다는 사실과 특정 질병이 확정됐다는 사실을 구별해야 한다.","간세포가 손상되면 AST·ALT가 증가할 수 있다. 그렇다고 간수치가 올랐다는 사실만으로 간경변이나 간부전을 확정할 수는 없다. 어떤 세포와 장기에 이상이 있는지, 그 이상이 어떤 진단과 연결되는지, 기능은 어느 정도 유지되는지를 나누어 읽는다."]},{"heading":"주요 기관계와 대표 질환","paragraphs":["순환계는 심장과 혈관을 중심으로 구성된다. 심장이 혈액을 보내고 혈관이 이동 통로를 제공한다. 교재에서 함께 살펴볼 대표 질환에는 심근경색과 심부전이 있다.","호흡계에는 폐와 기관지가 포함된다. 폐는 산소를 혈액으로 전달하고 이산화탄소를 배출하는 역할을 한다. 대표 질환으로 폐렴과 만성폐쇄성폐질환(COPD)을 연결해 볼 수 있다.","신경계는 뇌·척수·신경으로 구성된다. 뇌졸중과 치매는 이 기관계와 연결해 공부할 대표 질환이다. 질환의 이름을 외우는 데서 멈추지 말고, 손상 위치와 실제 기능 문제를 함께 살펴본다.","비뇨계에는 신장과 요로가 포함된다. 신장은 노폐물과 수분·전해질의 균형을 조절한다. 대표 질환에는 신부전과 결석이 있다.","소화계에는 위·장·간·췌장 등이 포함되며, 간경변과 췌장염 같은 질환을 연결해 볼 수 있다. 내분비계에서는 갑상선·췌장 등을 살펴보고 당뇨병과 갑상선질환을 대표적인 학습 주제로 연결한다."]},{"heading":"기관계는 혼자 움직이지 않는다","paragraphs":["장기는 혼자 일하지 않는다. 폐가 산소를 받아도 심장이 혈액을 보내지 못하면 조직에 산소가 충분히 도달하지 못한다. 신장은 혈액에서 노폐물을 걸러 내며, 그 기능은 순환 상태의 영향을 받는다.","폐가 산소를 혈액으로 전달하면 심장은 산소가 포함된 혈액을 전신 장기로 보낸다. 신장은 혈액에서 노폐물을 처리하고 수분·전해질의 균형을 조절한다. 이처럼 호흡·순환·배설 기능은 서로 이어져 있다.","심부전이 심해지면 신장으로 가는 관류가 감소해 신장기능 악화가 동반될 수 있다. 따라서 한 환자의 기록에 심장과 신장 문제가 함께 등장할 수 있다. 다만 서로 연관돼 있다는 것과 각각의 질병이 어떤 원인과 근거로 진단됐는지는 별도로 확인해야 한다."]},{"heading":"구조 손상과 기능 저하는 다른 말이다","paragraphs":["구조는 무엇이 어떻게 생겼는지, 기능은 실제로 일을 얼마나 수행하는지를 뜻한다. 영상에서 병변이 보이는 사실과 장기 기능이 심하게 떨어진 사실은 구별해야 한다. 작은 병변도 위치에 따라 큰 증상을 만들 수 있고, 구조 변화가 있어도 기능이 상당 부분 유지될 수 있다.","심장근육 손상과 심장 펌프 기능 저하를 예로 들어 보자. 일부 심근세포에 손상이 있더라도 그 임상적 의미는 손상 위치와 범위 등에 따라 달라질 수 있다. 한편 심장이 충분한 혈액을 내보내지 못하면 심부전 증상이 나타날 수 있다. 세포·조직의 손상과 장기의 기능 저하는 서로 관련되지만 같은 의미는 아니다."]},{"heading":"보험 실무에 연결하는 순서","paragraphs":["기록을 읽을 때는 손상된 장기, 확정된 질병, 실제 시행한 치료, 남은 기능장애를 따로 적는다. 같은 환자의 기록에 함께 등장한다고 해서 각각의 진단비·수술비·후유장해 지급요건이 모두 충족되는 것은 아니다."]},{"heading":"가상 사례 · 심장 입원 중 투석","paragraphs":["다음은 학습을 위한 가상 사례다. 고객이 “아버지가 심장 때문에 입원하셨는데, 신장도 나빠져서 투석까지 받으셨어요”라고 설명했다고 가정하자. 이때 의학적으로 확인할 내용과 보험에서 확인할 내용을 나누어 정리한다.","심부전으로 입원한 환자에게 신장기능 악화와 투석이 발생했다고 가정하자. 심부전의 진단 근거와 신장기능 악화의 원인, 일시적 투석인지 지속적 치료인지부터 확인한다. 다음으로 각 특약의 질병 정의와 치료 요건을 대조한다. 투석을 받았다는 한 문장만으로 만성 신장질환 담보까지 확정해서 설명하지 않는다.","의학적으로는 심장질환의 정확한 진단과 중증도, 신장기능 악화의 원인, 투석 시행 여부와 치료 경과를 확인한다. 보험에서는 각 진단의 확정 여부, 실제 치료내용, 특약별 지급사유를 따로 대조한다. 투석을 시행했다는 사실만으로 모든 신장 관련 특약의 지급이 확정되는 것은 아니다."]},{"heading":"핵심 정리와 다음 장","paragraphs":["이 장의 결론은 세 가지다. 인체는 세포 → 조직 → 장기 → 기관계로 구성된다. 한 장기의 질병은 다른 장기의 기능에도 영향을 줄 수 있다. 검사 이상, 확정진단, 기능장애, 보험금 지급요건은 구분해서 확인해야 한다.","아래의 요약 인포그래픽으로 각 기관계의 위치와 역할을 다시 정리한 뒤, 다음 장인 “심장과 혈관 — 혈액순환·산소공급·혈압”으로 이어서 공부한다."]}],"question":"장기 구조의 이상과 기능 저하를 따로 확인해야 하는 이유는?","answer":"병변의 존재·위치·범위와 실제 기능장애 정도는 일치하지 않을 수 있고, 약관도 서로 다른 사실을 지급요건으로 삼을 수 있기 때문이다.","references":["https://medlineplus.gov/healthtopics.html"]},"1-1-2":{"sections":[{"heading":"이 장의 읽기 지도","paragraphs":["심장은 피를 만들어 내는 기관이 아니라 혈액을 순환시키는 펌프다. 오른쪽 심장은 혈액을 폐로 보내고, 왼쪽 심장은 폐에서 산소를 받은 혈액을 온몸으로 보낸다. 동맥·정맥은 산소량이 아니라 심장을 기준으로 이동하는 방향으로 구별한다."]},{"heading":"비슷한 심장병을 구분하는 질문","paragraphs":["혈관의 문제인지, 심장근육의 손상인지, 펌프 기능의 문제인지, 전기신호의 문제인지 먼저 나눈다. 협심증·심근경색·심부전·부정맥을 모두 “심장이 안 좋다”로 묶으면 검사와 치료, 보장범위의 차이를 놓친다."]},{"heading":"가상 사례 · 스텐트를 넣었다면","paragraphs":["관상동맥 스텐트 시술을 받았다는 고객에게는 최종 진단명과 심전도·심근표지자·시술 기록을 확인한다. 스텐트는 좁아진 혈관을 유지하는 치료 도구이며 그 자체가 급성심근경색 진단을 뜻하지 않는다. 진단비 검토와 시술 관련 담보 검토를 나누어 설명한다."]}],"question":"스텐트 시술을 받았다는 사실만으로 급성심근경색을 확정할 수 있을까?","answer":"아니다. 실제 확정진단과 검사 근거를 확인하고, 진단비와 시술 관련 담보의 지급조건을 각각 대조해야 한다.","references":["https://medlineplus.gov/lab-tests/troponin-test/","https://www.radiologyinfo.org/en/info/angioplasty"]},"1-1-3":{"sections":[{"heading":"신경계는 몸의 정보망이다","paragraphs":["뇌와 척수는 중추신경계, 이들과 온몸을 연결하는 신경은 말초신경계다. 신경계는 움직임뿐 아니라 감각, 언어, 기억, 의식과 내부 장기의 조절에도 관여한다. “뇌가 다쳤다”는 말만으로 증상과 돌봄 필요도를 판단할 수 없다."]},{"heading":"손상 위치와 생활 기능을 연결하기","paragraphs":["뇌의 어느 부위가 손상되었는지와 실제 할 수 없는 행동을 함께 읽는다. 팔·다리 힘 저하, 말하기 어려움, 삼킴장애, 균형장애는 서로 다른 문제다. 같은 뇌경색 진단을 받아도 재활 내용과 일상생활의 도움 필요도는 다를 수 있다."]},{"heading":"가상 사례 · 진단 이후의 보장","paragraphs":["뇌경색 치료 뒤 편마비가 남은 고객은 진단비 확인에서 끝나지 않는다. 시행한 치료, 재활 경과, 장해 평가 자료, 실제 간병 사용과 공적 장기요양 인정 여부를 별도로 정리한다. 장기요양등급과 민영보험 후유장해는 서로 다른 평가체계다."]}],"question":"뇌경색 진단과 후유장해, 장기요양등급을 따로 검토하는 이유는?","answer":"질병의 확정, 남은 기능장애, 일상생활 도움 필요도는 평가 대상과 기준이 다르기 때문이다.","references":["https://medlineplus.gov/healthtopics.html"]},"1-1-4":{"sections":[{"heading":"호흡을 세 과정으로 이해하기","paragraphs":["환기는 공기를 드나들게 하는 과정, 확산은 폐포와 혈액 사이의 가스 이동, 관류는 폐혈관으로 혈액이 흐르는 과정이다. 호흡곤란이라는 같은 증상도 어느 과정에 문제가 생겼는지에 따라 원인과 치료가 달라진다."]},{"heading":"진단명과 치료행위를 분리하기","paragraphs":["폐렴은 폐 조직의 염증, 천식과 COPD는 기류제한을 중심으로 이해한다. 호흡부전은 산소 공급 또는 이산화탄소 배출이 충분하지 못한 상태와 관련된다. 산소치료 사실과 호흡부전의 확정진단은 기록에서 각각 확인해야 한다."]},{"heading":"가상 사례 · COPD 악화 입원","paragraphs":["COPD 환자가 호흡곤란으로 입원하고 산소치료를 받았다면, 급성악화 여부와 감염 동반, 혈액가스검사와 실제 환기보조 내용을 확인한다. 입원·중환자실·인공호흡기·간병은 각각 다른 사실이므로 한 번의 입원만으로 모든 담보가 해당한다고 설명하지 않는다."]}],"question":"산소포화도 수치 하나만으로 호흡 상태를 모두 설명할 수 있을까?","answer":"아니다. 산소화와 환기는 다르며 증상·혈액가스·영상·폐기능 등 필요한 근거를 함께 판단한다.","references":["https://medlineplus.gov/endoscopy.html","https://medlineplus.gov/lab-tests/how-to-understand-your-lab-results/"]},"1-1-5":{"sections":[{"heading":"간·신장·소화기는 맡은 일이 다르다","paragraphs":["소화관은 음식물을 이동시키고 잘게 분해해 영양분을 흡수한다. 간은 영양소 처리와 여러 물질의 대사, 담즙 생성 등에 관여한다. 신장은 노폐물을 배출하고 수분·전해질 균형을 조절한다. 모두 배 안에 있다고 같은 질병군으로 이해하면 안 된다.","위·장·간·췌장·담낭은 소화 과정에서 협력한다. 예를 들어 담즙이 흐르는 길의 문제와 간세포의 손상은 원인도, 확인하는 검사도 달라질 수 있다. 배가 아프다는 증상에서 어느 장기의 어떤 문제가 확인되었는지까지 내려가야 한다."]},{"heading":"장기가 손상된 것과 일을 못하는 것을 나누기","paragraphs":["AST·ALT 상승은 간세포 손상의 단서가 될 수 있지만 간이 수행하는 모든 기능을 직접 수치화한 것은 아니다. 신장도 영상에서 낭종이 보이는 것과 여과 기능이 떨어지는 것은 별개다. 구조·손상·기능을 나누어 읽어야 진단의 무게를 제대로 이해할 수 있다."]},{"heading":"대표적인 검사와 치료의 흐름","paragraphs":["증상과 진찰을 바탕으로 혈액·소변검사, 초음파·CT, 내시경 등 필요한 검사를 선택한다. 염증·폐쇄·종양·기능저하 중 무엇이 문제인지에 따라 약물, 내시경 치료, 수술, 투석 등으로 치료가 달라진다. 검사 이름이 같아도 검사 목적과 결과는 다를 수 있다."]},{"heading":"보험 실무 · 치료 사실을 구체화하기","paragraphs":["“간 치료를 받았다” 대신 최종 진단, 병변 위치, 실제 시술명, 치료 목적을 확인한다. “투석했다”면 시행일과 방식, 원인과 경과를 확인한다. 급성신손상과 만성 신장질환, 일시적 투석과 약관상 지속적인 치료 요건을 구별해야 한다."]},{"heading":"가상 사례 · 수치 이상에서 확정진단까지","paragraphs":["검진에서 간수치가 높고 초음파상 지방간이 의심된 고객을 가정하자. 검진 소견만으로 간경변·간부전으로 설명하지 않는다. 외래에서 확인된 최종 진단과 추가 검사, 치료 계획을 먼저 정리한다. 이후 가입 담보가 어떤 질병과 상태를 대상으로 하는지 확인한다."]}],"question":"간수치 상승과 간부전, 신장 낭종과 신부전은 각각 같은 말일까?","answer":"아니다. 검사 이상·구조 변화·장기 기능저하는 구별되는 개념이며 진단과 지급요건을 따로 확인한다.","references":["https://www.niddk.nih.gov/health-information/digestive-diseases/digestive-system-how-it-works","https://www.niddk.nih.gov/health-information/kidney-disease/kidneys-how-they-work"]},"1-1-6":{"sections":[{"heading":"방어·운반·조절이라는 세 가지 역할","paragraphs":["면역계는 감염 등으로부터 몸을 지키는 체계다. 혈액은 산소·영양소 등을 운반하고 방어와 지혈에도 관여한다. 내분비계는 호르몬으로 여러 장기의 활동을 조절한다. 혈액검사에 함께 표시되더라도 세 체계는 기능과 질병의 원리가 다르다."]},{"heading":"면역은 약해져도, 잘못 작동해도 문제가 된다","paragraphs":["면역기능이 충분하지 않으면 감염에 취약해질 수 있다. 반대로 자신의 조직을 공격하는 자가면역질환이나 특정 물질에 과민하게 반응하는 알레르기도 발생한다. “면역이 높다·낮다”는 한 줄 표현보다 어떤 반응이 문제인지 확인하는 편이 정확하다."]},{"heading":"혈액세포와 호르몬을 구분하기","paragraphs":["적혈구·헤모글로빈은 산소 운반, 백혈구는 면역반응, 혈소판은 지혈과 관련된다. 빈혈·백혈구 이상·혈소판 감소는 같은 진단이 아니다. 갑상선호르몬과 인슐린은 세포 수가 아니라 신체 기능을 조절하는 신호물질이며, 과다·결핍·작용 저항성 등에 따라 문제가 생긴다."]},{"heading":"검사와 치료를 읽는 방법","paragraphs":["CBC는 혈구의 수와 특성을, 호르몬검사는 해당 조절체계의 상태를 평가하는 데 쓰인다. 수치 이상이 있으면 원인 평가가 뒤따르며, 철분 보충·호르몬 조절·면역 조절 등 치료의 방향도 달라진다. 약물 이름만으로 질병의 종류나 중증도를 정하지 않는다."]},{"heading":"가상 사례 · 갑상선약과 항암약의 차이","paragraphs":["갑상선기능저하로 호르몬 보충약을 복용하는 고객과 갑상선암 치료 후 호르몬제를 복용하는 고객은 약이 비슷해 보여도 진단과 치료 경위가 다르다. 약 복용 사실에서 암 여부를 추정하지 말고, 진단서·병리 결과·수술 및 치료 이력을 확인한다. 보험은 실제 확정된 질병과 계약 요건으로 검토한다."]}],"question":"갑상선약을 복용한다는 사실만으로 갑상선암을 추정해도 될까?","answer":"아니다. 약의 처방 목적이 다를 수 있으므로 진단과 치료 경위를 확인해야 한다.","references":["https://medlineplus.gov/immunesystemanddisorders.html","https://medlineplus.gov/endocrinediseases.html","https://medlineplus.gov/lab-tests/complete-blood-count-cbc/"]},"1-2-1":{"sections":[{"heading":"질병·증상·징후·합병증을 구별하기","paragraphs":["질병은 신체의 구조나 기능에 이상이 생긴 상태를 이해하는 개념이다. 증상은 통증·어지럼처럼 환자가 느끼는 불편, 징후는 진찰·검사로 관찰되는 변화다. 합병증은 원래 질병이나 치료의 경과 중 함께 발생한 다른 문제를 말하며, 단순히 동반된 병과 인과관계를 구별해야 한다."]},{"heading":"같은 증상에 여러 원인이 있다","paragraphs":["가슴통증은 심장질환뿐 아니라 소화기·근육·폐 등의 문제에서도 생길 수 있다. 따라서 증상명은 진단의 출발점이다. “가슴이 아팠다”에서 곧바로 “심근경색이었다”로 넘어가면 의학적 판단과 보험 설명이 모두 틀어질 수 있다."]},{"heading":"의료기록의 서로 다른 층위","paragraphs":["기록에는 환자가 말한 증상, 의사가 의심한 질환, 검사를 통해 확인한 소견, 최종 진단이 함께 남는다. 이 네 항목을 한 줄에 정리해 보면 무엇이 확정되었고 무엇이 아직 의심 단계인지 드러난다. 결과가 바뀌었다면 진료 시점과 검사 시점을 함께 기록한다."]},{"heading":"보험 실무 · 청구의 출발점","paragraphs":["진단비를 확인할 때는 증상만 있는지 질병이 확정되었는지 확인한다. 수술·치료 관련 담보는 진단 외에 실제 시행한 행위가 중요하다. 후유장해는 남은 기능장애를 별도로 평가한다. 의료행위가 있었던 사실과 각 보장의 지급요건을 연결하는 것이 실무다."]},{"heading":"가상 사례 · 어지럼으로 입원","paragraphs":["어지럼으로 입원해 뇌 MRI를 촬영했지만 뇌경색이 확인되지 않은 고객을 가정하자. MRI 촬영과 입원 사실을 근거로 뇌경색 진단비를 설명하지 않는다. 최종 진단과 퇴원기록을 확인하고 입원·실손 등 해당 계약에서 검토할 항목을 나눈다."]}],"question":"검사를 받았다는 사실과 그 질병이 확정되었다는 사실은 같은가?","answer":"다르다. 검사는 의심 질병을 확인하거나 배제하기 위해서도 시행되므로 최종 결과가 필요하다.","references":["https://medlineplus.gov/lab-tests/differential-diagnosis/"]},"1-2-2":{"sections":[{"heading":"질병은 하나의 원인으로만 설명되지 않는다","paragraphs":["감염·유전적 요인·생활습관·환경 노출·노화·면역 이상 등이 질병 발생에 관여한다. 어떤 병은 병원체가 직접 원인이 되지만, 어떤 병은 여러 위험요인이 오랜 기간 쌓여 발생한다. 같은 노출을 경험해도 모든 사람에게 같은 결과가 생기는 것은 아니다."]},{"heading":"원인과 위험요인의 차이","paragraphs":["위험요인은 발생 가능성과 관련된 요소다. 위험요인이 있다고 현재 질병이 확정된 것은 아니며, 위험요인이 없다고 질병이 절대 생기지 않는 것도 아니다. 가족력은 개인의 확정진단과 다르고, 유전적 소인이 있다는 말도 반드시 발병한다는 뜻은 아니다."]},{"heading":"발생 원리를 치료와 연결하기","paragraphs":["혈관이 막히는 문제와 면역계가 자신의 조직을 공격하는 문제는 접근이 다르다. 감염에서도 원인 미생물과 감염 부위에 따라 치료가 달라진다. 질병의 이름뿐 아니라 발생 기전을 이해하면 검사와 치료가 왜 필요한지 설명하기 쉬워진다."]},{"heading":"보험 실무 · 고지와 진단을 구별하기","paragraphs":["가족력·검사 이상·의심 소견·치료 이력은 서로 다른 정보다. 실제 가입 심사에서는 해당 청약서의 질문 내용과 기간에 맞추어 사실대로 확인해야 한다. 질병의 위험이 높다는 추정만으로 계약의 고지대상이나 보험금 결론을 임의로 정하지 않는다."]},{"heading":"가상 사례 · 가족력만 있는 고객","paragraphs":["부모에게 당뇨병이 있지만 본인은 진단받지 않은 고객을 가정하자. 가족력이 있다는 사실을 본인 당뇨병으로 기록해서는 안 된다. 반대로 검진 이상이나 실제 진료 이력이 있다면 그 사실은 별도로 확인한다. 위험도, 현재 진단, 질문에 대한 답변을 나누는 것이 핵심이다."]}],"question":"가족력이 있으면 본인도 이미 그 질병에 걸린 것일까?","answer":"아니다. 가족력은 위험 평가의 단서이며 본인의 진단 여부는 실제 검사·진료 근거로 확인한다.","references":["https://medlineplus.gov/genetics/understanding/mutationsanddisorders/"]},"1-2-3":{"sections":[{"heading":"발생·발견·치료·회복은 서로 다른 시점이다","paragraphs":["질병이 몸 안에서 시작된 시점과 증상이 나타난 시점, 검사로 확인된 시점은 같지 않을 수 있다. 치료가 끝난 뒤에도 추적관찰이나 재활이 이어질 수 있다. 병의 진행을 시간 순으로 정리하면 진단서 한 장에서 놓치기 쉬운 경과를 이해할 수 있다."]},{"heading":"급성·만성은 단순히 가벼움·심함이 아니다","paragraphs":["급성은 발생과 경과가 비교적 빠른 양상, 만성은 오랫동안 지속되는 양상을 설명한다. 정확한 구분은 질병마다 다르다. 만성질환도 급격히 악화될 수 있고, 급성질환을 치료한 뒤 후유증이 오래 남을 수 있다."]},{"heading":"재발·전이·후유증을 구별하기","paragraphs":["재발은 치료 후 다시 나타나는 것, 전이는 암이 원래 발생한 곳에서 다른 부위로 퍼지는 것을 설명한다. 후유증은 원래 질병이나 손상 뒤 남은 기능 문제다. 암의 병기는 암 종류별 체계로 평가하며 모든 암의 단계를 하나의 잣대로 설명하지 않는다."]},{"heading":"보험 실무 · 날짜와 상태를 함께 읽기","paragraphs":["최초 증상일·초진일·확정진단일·치료일·재발 확인일을 분리한다. 보험은 계약에 따라 진단 시점, 보장개시, 지급횟수, 재진단 요건 등을 다르게 규정할 수 있다. “예전에도 아팠다”는 표현만으로 새 진단의 성격을 결정하지 않는다."]},{"heading":"가상 사례 · 치료 종료 뒤 다시 발견된 암","paragraphs":["수술 뒤 추적관찰 중 병변이 발견되었다면 원래 암의 재발인지, 다른 부위 전이인지, 새로운 원발암인지 의학적 평가를 먼저 확인한다. 고객이 “또 암”이라고 표현해도 담보의 재진단·전이·새로운 암 정의는 계약별로 따로 검토한다."]}],"question":"암 치료 뒤 다시 생긴 병변은 모두 새로운 원발암일까?","answer":"아니다. 재발·전이·새 원발암의 구별은 진료 근거가 필요하고 보장 정의도 따로 확인한다.","references":["https://www.cancer.gov/about-cancer/diagnosis-staging/diagnosis"]},"1-2-4":{"sections":[{"heading":"진단은 정보를 모아 가능성을 좁히는 과정이다","paragraphs":["의사는 증상과 과거력, 진찰, 혈액·영상·병리검사 등을 종합해 진단한다. 처음부터 한 병만 검사하는 것이 아니라 여러 후보를 비교하는 감별진단 과정을 거친다. 초기 의심과 최종 진단이 다른 것은 이 과정의 결과일 수 있다."]},{"heading":"검사마다 답하는 질문이 다르다","paragraphs":["혈액검사는 세포 수나 특정 물질을, 영상검사는 장기의 구조와 병변을, 병리검사는 채취한 조직이나 세포를 평가한다. 같은 질병을 의심해도 검사들이 제공하는 정보는 다르다. 검사 수치 하나가 높거나 영상에 이상이 보였다는 사실만으로 확정진단 전체를 대신할 수 없다."]},{"heading":"선별검사와 확진 목적 검사를 구별하기","paragraphs":["선별검사는 증상이 없는 사람에게도 이상 가능성을 찾아 후속 평가로 연결한다. 양성 결과가 곧 확정진단인 것은 아니다. 확진에 필요한 검사와 기준은 질병에 따라 다르며, 필요한 경우 반복 검사나 조직검사, 전문의 평가가 이어진다."]},{"heading":"보험 실무 · 진단 근거를 찾는 위치","paragraphs":["진단서뿐 아니라 병리 결과지, 영상 판독지, 검사 결과, 퇴원요약 등에서 진단의 근거를 확인한다. 어느 문서가 필요한지는 질병과 담보에 따라 다르다. 약관이 정한 진단확정 방법이나 예외 규정이 있는지도 확인해야 한다."]},{"heading":"가상 사례 · 검진에서 폐 결절","paragraphs":["폐 CT에서 결절이 발견된 고객이 “폐암이라더라”고 말했더라도 판독문의 의심 표현과 최종 진단을 구별한다. 추가 영상·추적관찰·조직검사 중 어떤 절차가 진행되는지 확인한다. 결절 발견 사실, 암 확정 여부, 치료 계획을 나누어 안내한다."]}],"question":"선별검사 양성이 확정진단과 같은 뜻이 아닌 이유는?","answer":"선별검사는 이상 가능성을 찾는 목적이며 위양성도 있을 수 있어 해당 질병의 진단 절차가 추가로 필요하기 때문이다.","references":["https://medlineplus.gov/lab-tests/differential-diagnosis/","https://www.cancer.gov/about-cancer/diagnosis-staging/diagnosis"]},"1-2-5":{"sections":[{"heading":"진단서는 질병을 설명하고 코드는 분류한다","paragraphs":["진단명은 의사가 판단한 질병의 이름이고, 질병분류기호는 이를 일정한 체계로 기록하는 부호다. 진단서에서는 두 항목을 함께 읽어야 한다. 숫자가 적혀 있다는 이유만으로 특정 담보가 보장하는 질병의 정의까지 모두 확인된 것은 아니다."]},{"heading":"문서의 목적과 작성 시점이 중요하다","paragraphs":["처방전·진료비 서류·검진 결과지·진단서는 작성 목적이 다르다. 검사 전의 의심 병명이 진료 과정에 남아 있을 수 있으므로 발급일과 진료 시점, 최종 진단 여부를 확인한다. 같은 고객에게서 서로 다른 코드가 보이면 먼저 어떤 방문과 진단을 설명하는지 구분한다."]},{"heading":"진단서에서 확인할 다섯 항목","paragraphs":["진단명과 전체 코드, 확정·의증 등의 표현, 발병 및 진단 시점, 치료 내용과 향후 소견, 발급 의료기관과 진료 맥락을 읽는다. 모든 항목이 모든 서식에 같은 방식으로 적히는 것은 아니므로 필요한 정보가 빠졌다면 해당 근거 서류를 확인한다."]},{"heading":"보험 실무 · 코드에서 약관으로 이동하기","paragraphs":["진단명·코드를 확인한 다음 실제 가입 담보의 질병분류표와 정의를 대조한다. 이어서 진단확정 요건, 보장개시일, 지급횟수 등 계약조건을 살핀다. 유사한 담보명이나 다른 고객의 지급 사례를 현재 계약의 기준으로 대체하지 않는다."]},{"heading":"가상 사례 · 처방전과 퇴원 진단이 다른 경우","paragraphs":["외래 처방전에는 증상 코드가, 입원 후 퇴원 서류에는 확정 질병 코드가 적혔다면 두 문서가 다른 단계의 기록인지 확인한다. 불리하거나 유리한 코드 하나만 고르는 대신 진료 경과와 최종 진단의 근거를 연결해서 검토한다."]}],"question":"진단서와 처방전에 코드가 다르면 곧바로 오류라고 할 수 있을까?","answer":"아니다. 진료 시점·문서 목적·추가 검사 후 진단 변경 가능성을 먼저 확인해야 한다.","references":["https://www.who.int/standards/classifications/classification-of-diseases/"]},"1-2-6":{"sections":[{"heading":"진단에는 불확실성이 남을 수 있다","paragraphs":["의학적 판단은 제한된 시점의 정보로 이루어진다. 질병 초기에는 소견이 충분하지 않거나 다른 질환과 비슷하게 보일 수 있다. 시간이 지나 새 검사나 경과가 확인되면 진단이 달라질 수 있으며, 모든 진단 변경을 곧바로 의료상 과실로 단정해서는 안 된다."]},{"heading":"위양성과 위음성을 이해하기","paragraphs":["위양성은 실제 질병이 없는데 검사에서 이상이 나타나는 경우, 위음성은 질병이 있지만 검사에서 잡히지 않는 경우다. 검사 특성과 검사 시점, 검체 상태 등에 따라 결과가 영향을 받는다. 민감도·특이도는 검사 성능을 설명하는 지표이며 개인의 최종 진단을 혼자 결정하지 않는다."]},{"heading":"재검사와 재진단의 역할","paragraphs":["재검사는 같은 지표를 다시 측정하거나 다른 방법으로 확인하는 절차이고, 재진단은 새 정보를 반영해 진단을 다시 판단하는 과정이다. 검사 수치가 정상으로 돌아온 것과 과거 질병이 없었다는 결론은 다르다. 치료 효과인지, 일시적 변화인지도 구별해야 한다."]},{"heading":"보험 실무 · 변경 전후 기록 보존","paragraphs":["최초 의심, 검사 결과, 최종 진단, 변경 사유를 시간 순으로 정리한다. 진단서가 정정되었다면 누가 어떤 근거로 수정했는지 확인한다. 이미 청구했거나 지급된 건의 처리는 계약과 실제 사실관계에 따라 검토하며 임의로 환수·추가지급을 확정하지 않는다."]},{"heading":"가상 사례 · 암 의심 뒤 양성 종양 확인","paragraphs":["영상검사에서 암을 의심했지만 조직검사에서 양성 종양으로 확인되었다면, 최초 의심 문구를 확정 암진단으로 설명하지 않는다. 반대로 최초 검사에서 발견되지 않았더라도 이후 확정된 진단은 그 근거와 시점으로 검토한다."]}],"question":"검사 결과가 나중에 달라졌다는 사실만으로 오진이나 지급 취소를 확정할 수 있을까?","answer":"아니다. 검사와 진단이 변한 이유, 실제 확정진단, 계약의 지급조건을 함께 확인해야 한다.","references":["https://medlineplus.gov/lab-tests/how-to-understand-your-lab-results/","https://medlineplus.gov/lab-tests/differential-diagnosis/"]},"1-3-1":{"sections":[{"heading":"CBC는 무엇을 세는 검사인가?","paragraphs":["총혈구검사(CBC)는 적혈구·백혈구·혈소판과 헤모글로빈 등 혈액세포의 수와 특성을 평가한다. 혈액을 “피가 맑다·탁하다”로 표현하는 대신, 어떤 세포나 성분에 변화가 있는지를 읽는 출발점이다. 검진과 질병 평가, 치료 중 상태 관찰 등 여러 목적으로 사용한다."]},{"heading":"적혈구·백혈구·혈소판을 따로 읽기","paragraphs":["적혈구와 헤모글로빈은 산소 운반과 관련된다. 빈혈 소견이 있으면 출혈·영양 상태·만성질환 등 원인을 살펴야 한다. 백혈구는 방어 반응, 혈소판은 지혈에 관여하므로 백혈구 증가와 혈소판 감소는 의미가 다르다. 각 지표의 이상만으로 특정 원인 질병을 정하지 않는다."]},{"heading":"숫자를 읽기 전에 확인할 것","paragraphs":["검사실 참고범위와 단위, 검사 날짜, 기존 결과와의 변화를 확인한다. 같은 수치라도 나이와 상태, 검사 방법에 따라 해석이 달라질 수 있다. 결과지의 H·L 표시는 참고범위 밖이라는 표식이며 질병의 중증도나 보험금 지급 표시가 아니다."]},{"heading":"보험 실무 · 이상 소견에서 진단으로","paragraphs":["빈혈 소견, 빈혈의 확정진단, 수혈 시행은 서로 다른 정보다. 진단비를 확인할 때는 해당 질병의 범위를, 수혈·입원 등 치료 관련 담보는 실제 행위와 계약 요건을 대조한다. 한 번의 CBC로 백혈병이나 골수질환을 확정해서 설명하지 않는다."]},{"heading":"가상 사례 · 헤모글로빈 감소","paragraphs":["검진에서 헤모글로빈이 낮아 추가 진료를 받은 고객이 있다. 먼저 철결핍·출혈 등 어떤 원인이 평가되었고 최종 진단이 무엇인지 확인한다. 수혈이 있었다면 수혈 기록도 따로 정리한다. “빈혈 수치가 낮다”는 한 줄에서 암이나 중증 혈액질환으로 비약하지 않는 것이 핵심이다."]}],"question":"CBC에서 H·L이 표시되면 그 질병이 확정된 것일까?","answer":"아니다. 어떤 지표가 변했는지와 원인 평가, 최종 진단을 확인해야 한다.","references":["https://medlineplus.gov/lab-tests/complete-blood-count-cbc/"]},"1-3-2":{"sections":[{"heading":"간검사와 신장검사는 서로 다른 질문을 한다","paragraphs":["간검사는 간세포 손상·담즙 흐름·합성 기능 등을 살피는 여러 항목의 묶음이다. 신장검사는 혈액의 노폐물 지표와 추정 여과능, 소변의 단백·혈액 등을 평가한다. “간수치·신장수치가 안 좋다”는 표현을 개별 검사 항목으로 풀어야 한다."]},{"heading":"AST·ALT와 간 기능을 혼동하지 않기","paragraphs":["AST·ALT 상승은 세포 손상에 관한 단서다. 빌리루빈·알부민 등은 다른 정보를 제공하며 특정 항목의 변화에는 간 이외의 요인도 관여할 수 있다. 검사 하나를 모든 간질환의 확진표나 중증도표로 사용하지 않는다."]},{"heading":"크레아티닌·eGFR·소변검사의 관계","paragraphs":["크레아티닌은 신장 여과능 평가에 쓰이지만 근육량 등 다른 요인의 영향을 받을 수 있다. eGFR은 여러 정보를 이용한 추정치이고, 소변 알부민 등은 신장 손상의 다른 단서를 제공한다. 급성 변화인지 지속되는 이상인지 시간 경과를 함께 읽는 것이 중요하다."]},{"heading":"보험 실무 · 투석과 만성질환을 구별하기","paragraphs":["입원 중 한 번의 신기능 저하, 만성 신장질환의 확정진단, 투석 시행 사실은 각각 정리한다. 약관이 특정 중증 상태나 지속적인 치료를 요구하면 그 정의와 기간을 확인한다. 검사 참고범위 밖이라는 사실을 약관상 신부전 상태와 동일하게 보지 않는다."]},{"heading":"가상 사례 · 탈수 뒤 크레아티닌 상승","paragraphs":["구토·설사로 입원한 고객에게 신장 관련 수치 변화가 나타났다가 치료 뒤 회복되었다고 가정하자. 최종 진단과 원인, 과거 수치 및 회복 경과를 확인한다. 회복된 결과가 최초 이상을 없애는 것은 아니지만, 일시적 이상을 근거로 지속적인 만성 상태를 단정할 수도 없다."]}],"question":"eGFR 결과 한 번으로 모든 만성 신장질환 보장을 판단할 수 있을까?","answer":"아니다. 진단 근거와 지속성·경과, 실제 치료, 해당 약관의 정의를 함께 확인한다.","references":["https://medlineplus.gov/lab-tests/liver-function-tests/","https://medlineplus.gov/kidneytests.html"]},"1-3-3":{"sections":[{"heading":"염증은 몸의 반응이고 감염은 원인 중 하나다","paragraphs":["염증은 손상이나 자극 등에 대한 신체 반응이다. 감염은 세균·바이러스 등 미생물의 침입과 관련되며 염증을 일으킬 수 있다. 그러나 자가면역질환이나 조직 손상에서도 염증 반응이 나타날 수 있으므로 두 단어를 같은 뜻으로 사용하면 안 된다."]},{"heading":"CRP·ESR·백혈구가 알려 주는 것","paragraphs":["CRP와 ESR은 염증을 평가하는 지표이며, 백혈구 수와 분획도 임상 판단에 활용된다. 이 수치들은 원인과 위치를 혼자 확정하지 못한다. 검사 시점과 치료 경과에 따라 달라질 수 있어 증상·진찰·다른 검사와 함께 읽어야 한다."]},{"heading":"배양검사와 PCR의 질문은 다르다","paragraphs":["배양은 검체에서 미생물의 성장을 확인하는 방식, PCR 등 분자검사는 특정 유전물질을 검출하는 방식이다. 검체 부위, 채취 시점, 항생제 사용 등의 맥락이 중요하다. 검출 결과와 실제 감염 상태, 중증도는 연결해서 해석해야 하며 검사 양성만으로 모두 같은 진단이 되지는 않는다."]},{"heading":"보험 실무 · 패혈증으로 곧바로 넘어가지 않기","paragraphs":["발열·CRP 상승·항생제 투여가 있었다는 사실만으로 패혈증이나 특정 감염병을 확정하지 않는다. 최종 진단, 감염 부위·원인, 장기 기능장애 평가와 치료 기록을 확인한다. 보험약관에 특정 질병 정의가 있으면 해당 근거를 대조한다."]},{"heading":"가상 사례 · 수술 뒤 염증수치 상승","paragraphs":["수술 뒤 CRP가 높아 항생제를 사용한 고객에게는 단순한 수술 후 변화인지, 실제 감염이 확인된 것인지, 어떤 진단이 내려졌는지 묻는다. 감염 의심, 확정된 수술부위 감염, 전신적인 중증 상태를 같은 사건으로 묶지 않는다."]}],"question":"CRP가 높고 항생제를 맞으면 반드시 패혈증일까?","answer":"아니다. 염증수치와 약물 사용은 단서이고 실제 진단 및 근거가 필요하다.","references":["https://medlineplus.gov/lab-tests/c-reactive-protein-crp-test/"]},"1-3-4":{"sections":[{"heading":"심장검사는 손상·전기·구조·기능을 나누어 본다","paragraphs":["트로포닌은 심근손상의 표지자, 심전도는 심장의 전기활동, 심초음파는 구조와 기능을 평가하는 검사다. 각각 보는 대상이 달라 하나의 정상 또는 이상 결과로 심장 상태 전체를 대표할 수 없다."]},{"heading":"트로포닌 상승이 의미하는 범위","paragraphs":["트로포닌 상승은 심근손상의 중요한 단서지만 급성심근경색과 같은 뜻은 아니다. 증상, 수치의 시간적 변화, 심전도와 영상 등 허혈을 뒷받침하는 정보를 종합한다. 검사법별 기준이 다르므로 임의의 공통 숫자로 확정진단을 대신하지 않는다."]},{"heading":"심부전·부정맥 평가와 구별하기","paragraphs":["BNP·NT-proBNP는 심부전 평가에 활용되지만 임상 상태와 함께 읽어야 한다. 심전도·홀터검사는 박동의 이상을, 심초음파는 수축기능과 판막 등을 평가한다. 관상동맥 검사는 혈관 협착·폐색을 살피므로 부정맥 평가와 목적이 다를 수 있다."]},{"heading":"보험 실무 · 어느 담보를 검토하는가","paragraphs":["최종 진단이 협심증인지 심근경색인지, 심부전인지 부정맥인지 분리한다. 가입한 담보마다 포함하는 질병과 진단 요건이 다르다. 중재술 시행, 중환자실 입원, 인공심폐 장치 사용 등은 진단과 별도로 실제 행위를 확인한다."]},{"heading":"가상 사례 · 트로포닌 상승 통보","paragraphs":["고객이 “심장 수치가 높아서 심근경색이라고 생각했다”고 말한다면, 수치 결과와 의사의 최종 판단을 구별한다. 진단서·심전도·추적 채혈·영상 자료 중 필요한 근거를 확인하고, 진단비와 치료 관련 담보를 각각 검토한다."]}],"question":"트로포닌·심전도·심초음파는 같은 정보를 제공하는가?","answer":"아니다. 심근손상, 전기활동, 구조와 기능 등 평가 대상이 달라 종합해서 해석한다.","references":["https://medlineplus.gov/lab-tests/troponin-test/"]},"1-3-5":{"sections":[{"heading":"종양표지자는 암을 이해하는 단서다","paragraphs":["종양표지자는 암과 관련해 혈액·체액·조직 등에서 평가하는 물질이나 특성이다. 진단 보조, 치료 선택, 치료 반응 관찰, 재발 감시 등에 활용되며 표지자마다 목적이 다르다. 모든 암을 한 번에 확정하는 보편적인 혈액검사는 아니다."]},{"heading":"높아도 암이 아닐 수 있고 낮아도 배제되지 않는다","paragraphs":["일부 표지자는 양성 질환 등에서도 상승할 수 있다. 반대로 암이 있어도 해당 표지자가 뚜렷하게 높지 않을 수 있다. 따라서 CEA·AFP·CA19-9·PSA 같은 이름을 접하면 검사 목적과 이전 결과, 영상·병리 결과를 함께 살펴야 한다."]},{"heading":"진단 표지자와 치료 선택 표지자를 구분하기","paragraphs":["암의 조직과 분자 특성을 보는 검사 중에는 특정 치료의 적합성을 판단하는 데 쓰이는 것이 있다. 이는 “암이 있는가”라는 질문과 “어떤 치료가 적합한가”라는 질문의 차이다. 검사 양성 결과만으로 실제 표적치료제가 투여되었다고 기록하지 않는다."]},{"heading":"보험 실무 · 검사·진단·투약의 세 단계","paragraphs":["종양표지자 검사 시행, 암 확정진단, 특정 항암치료 시행을 나누어 정리한다. 진단비는 계약의 진단확정 기준을, 치료비는 실제 약제·치료 목적·시행 기록과 담보 요건을 대조한다. 유전자 변이가 확인된 사실과 약관이 보장하는 특정 치료를 받은 사실은 다르다."]},{"heading":"가상 사례 · CA19-9 상승","paragraphs":["검진에서 CA19-9가 상승한 고객이 곧바로 췌장암 진단비를 문의했다면 추가 진료에서 무엇이 확인되었는지부터 정리한다. 수치만으로 암을 확정하거나 배제하지 않는다. 영상과 필요 시 병리 등으로 최종 판단이 이루어진 뒤 해당 계약을 검토한다."]}],"question":"종양표지자 상승만으로 암진단비 지급을 확정할 수 있을까?","answer":"아니다. 표지자의 역할과 한계를 이해하고 확정진단 근거 및 약관 요건을 확인해야 한다.","references":["https://www.cancer.gov/about-cancer/diagnosis-staging/diagnosis/tumor-markers-fact-sheet","https://www.cancer.gov/about-cancer/treatment/types/biomarker-testing-cancer-treatment"]},"1-3-6":{"sections":[{"heading":"검진 결과는 진료로 이어지는 출발점이다","paragraphs":["건강검진은 증상이 없는 사람에서도 위험요인이나 이상 가능성을 찾는다. 결과지의 재검·추적관찰·정밀검사 권고는 다음 평가가 필요하다는 뜻이지 모두 확정 질병을 의미하는 것은 아니다. 각 표현을 실제 진료 단계와 연결해서 읽는다."]},{"heading":"기준범위와 진단 기준의 차이","paragraphs":["참고범위는 검사실과 대상 집단, 검사 방법 등에 따라 달라질 수 있다. 범위 밖이라고 반드시 질병인 것도 아니고 범위 안이라고 모든 질병이 배제되는 것도 아니다. 특정 질병의 진단 기준과 단순 참고범위를 같은 표로 취급하지 않는다."]},{"heading":"결과를 종합하는 다섯 가지 축","paragraphs":["검사 날짜와 조건, 단위와 참고범위, 이전 결과와의 추세, 다른 검사와의 일치 여부, 증상과 진료 맥락을 확인한다. 결과가 상충하면 유리한 수치만 고르지 말고 전문의의 최종 해석과 후속 평가를 확인한다."]},{"heading":"보험 실무 · 가입 전 질문과 청구 판단","paragraphs":["청약 단계에서는 실제 청약서가 묻는 검사·재검·진단·치료 이력을 문구와 기간에 맞추어 확인한다. 청구 단계에서는 확정진단·시행 치료·계약 요건을 검토한다. “검진이라서 모두 고지와 무관하다”거나 “재검이면 이미 질병”이라고 일괄 설명하지 않는다."]},{"heading":"가상 사례 · 여러 항목에 H 표시","paragraphs":["간수치·혈당·지질에 이상 표시가 있는 고객에게는 어떤 항목이 재검되었고 어떤 진단과 치료가 이어졌는지 구분한다. 종이 한 장의 H 개수로 질병 수나 중증도를 세지 않는다. 항목별 진료 경과를 표로 만들면 가입·청구 양쪽에서 누락을 줄일 수 있다."]}],"question":"건강검진의 재검 권고와 확정진단을 구분해야 하는 이유는?","answer":"평가 과정의 단계가 다르고 실제 가입 질문 및 지급요건도 다르게 검토해야 하기 때문이다.","references":["https://medlineplus.gov/lab-tests/how-to-understand-your-lab-results/","https://medlineplus.gov/laboratorytests.html"]},"1-4-1":{"sections":[{"heading":"수술은 목적·대상·방법으로 읽는다","paragraphs":["수술은 질병이나 손상을 진단·치료하거나 기능을 회복하기 위해 신체 조직에 시행하는 처치로 이해할 수 있다. 실제 의료현장의 수술·시술 명칭과 보험약관이 정한 수술의 정의는 일치하지 않을 수 있다. 보험 실무에서는 일상 용어보다 실제 행위와 계약 문구가 중요하다."]},{"heading":"절제·절개·봉합·재건의 차이","paragraphs":["절제는 조직을 떼어 내는 것, 절개는 조직을 열거나 가르는 것, 봉합은 조직을 이어 닫는 것, 재건은 구조와 기능을 복원하는 것을 설명한다. 이름에 같은 단어가 있어도 대상 장기와 범위가 다르면 실제 치료는 크게 달라질 수 있다. “절제술”이라는 끝부분만 보고 수술 종류나 지급액을 결정하지 않는다."]},{"heading":"진단 목적과 치료 목적을 구별하기","paragraphs":["조직검사는 병변의 성격을 알아내기 위한 목적으로 시행될 수 있다. 종양을 모두 제거하는 수술은 치료 목적이고, 일부 제거·증상 완화·기능 복원 등 다른 목적도 있다. 치료 목적이라고 모두 같은 수술비에 해당하는 것도, 진단 목적이면 모든 담보에서 제외되는 것도 아니므로 약관별로 확인한다."]},{"heading":"보험 실무에서 모아야 할 기록","paragraphs":["수술확인서나 수술기록에서 수술명·대상 장기·시행일·방법·목적을 정리한다. 필요하면 병리 결과와 진단을 연결한다. 수술분류표가 있는 담보는 해당 항목과 제외 규정을 함께 확인하며, 병원에서 큰 수술이라고 설명한 정도를 지급 종별로 바꾸지 않는다."]},{"heading":"가상 사례 · 같은 절제술이라는 표현","paragraphs":["대장 용종 절제와 대장 일부를 제거하는 수술은 모두 절제라는 단어가 들어가지만 대상·범위·접근법이 다르다. 진단명과 시술·수술 기록을 확인해 실제 행위를 분리한 뒤 계약의 수술 정의와 분류표를 대조한다."]}],"question":"수술명에 “절제”가 들어가면 모두 같은 수술종에 해당할까?","answer":"아니다. 실제 대상·범위·방법과 해당 계약의 수술분류표를 확인해야 한다.","references":["https://www.cancer.gov/about-cancer/treatment/types/surgery"]},"1-4-2":{"sections":[{"heading":"접근법은 병변에 도달하는 길이다","paragraphs":["개복은 배를 열어, 개흉은 가슴을 열어 접근하는 방법이다. 복강경·흉강경은 작은 절개를 통해 카메라와 기구를 넣고 화면을 보며 시행하는 방법이다. 접근법은 치료할 질병의 이름이나 제거 범위와는 별도의 정보다."]},{"heading":"작은 상처와 작은 치료를 혼동하지 않기","paragraphs":["절개가 작아도 내부에서는 장기의 일부 또는 전체를 제거할 수 있다. 반대로 피부 절개가 크다는 사실만으로 질병의 병기나 중증도를 확정할 수 없다. 최소침습 접근은 회복에서 장점이 있을 수 있지만 환자 상태와 수술 범위에 따라 차이가 있고 합병증 가능성이 사라지는 것은 아니다."]},{"heading":"수술 도중 접근법이 바뀔 수 있다","paragraphs":["출혈이나 유착 등 상황에 따라 처음 계획한 복강경 수술이 개복으로 전환될 수 있다. 기록에서는 예정된 수술명과 최종 시행 방법을 나누어 읽는다. 수술 전 설명서만으로 실제 치료를 확정하지 말고 최종 수술기록을 확인한다."]},{"heading":"보험 실무 · 장기·범위·접근법을 한 줄에","paragraphs":["예를 들어 “담낭 절제 / 복강경 / 시행일”처럼 대상·행위·방법을 함께 정리한다. 개복 여부를 조건으로 삼는지, 내시경·경피적 수술에 별도 규정이 있는지 등은 담보 문구를 확인한다. 흉강경을 흉부 밖에서 검사만 한 것으로 오해해서도 안 된다."]},{"heading":"가상 사례 · 복강경 위절제","paragraphs":["위암으로 복강경 위절제를 받은 환자에게 “배를 크게 열지 않았으니 작은 시술”이라고 설명하면 실제 치료 범위를 놓친다. 위의 절제 범위와 최종 진단, 림프절 절제 등 수술기록을 읽고 해당 담보의 조건을 검토한다."]}],"question":"복강경 수술은 모두 간단한 시술이라고 볼 수 있을까?","answer":"아니다. 접근법의 절개 크기와 내부 치료 범위·질병 중증도는 별개다.","references":["https://www.cancer.gov/about-cancer/treatment/types/surgery"]},"1-4-3":{"sections":[{"heading":"로봇이 혼자 판단해서 수술하는 것은 아니다","paragraphs":["로봇수술은 의사가 조작하는 장비를 통해 수술기구를 움직이는 방식이다. 확대된 시야와 기구의 정밀한 조작을 활용할 수 있지만, 치료 계획과 수술 판단은 의료진이 한다. 로봇이라는 이름을 자율적으로 치료하는 기계로 이해하면 안 된다."]},{"heading":"일반 복강경과 무엇이 다른가","paragraphs":["두 방식 모두 작은 절개를 활용할 수 있으나 기구의 움직임과 조작 방식, 장비가 제공하는 시야 등이 다르다. 로봇 사용 여부와 실제 절제·봉합·재건의 범위는 별도로 기록한다. 로봇을 사용했다고 모든 환자에게 더 적합하거나 합병증이 없다고 보장할 수 없다."]},{"heading":"환자가 묻는 비용을 읽는 방법","paragraphs":["총비용을 수술·마취·입원·검사·재료 등으로 나누고, 진료비 영수증과 세부내역서에서 급여·비급여 및 실제 본인부담을 확인한다. 장비 사용 사실만으로 모든 비용의 급여 여부나 실손 보상 비율을 단일 숫자로 설명하지 않는다."]},{"heading":"보험 실무 · 로봇수술 특약과 일반 수술비","paragraphs":["실제 수술명, 대상 질환과 장기, 로봇 보조 시행 여부를 확인한다. 로봇 관련 특약이 있더라도 보장 대상 수술의 범위·회수·면책 등 조건을 대조한다. 일반 수술비나 실손은 각각의 계약 요건으로 별도 검토하며 로봇이라는 이름만으로 중복 지급을 확정하지 않는다."]},{"heading":"가상 사례 · 전립선 수술 상담","paragraphs":["전립선암 고객이 로봇수술을 예정하고 있다면 예정과 시행 사실을 구분한다. 수술 후에는 최종 수술기록과 진단·병리 결과, 비용 서류를 확인한다. 상담 때는 “로봇이라 무조건 보장” 대신 가입 담보의 대상 수술과 실제 행위가 일치하는지를 설명한다."]}],"question":"로봇 사용 여부와 수술의 질병·범위는 같은 정보인가?","answer":"아니다. 장비·접근법과 실제 대상 질환 및 치료 범위를 나누어 확인해야 한다.","references":["https://medlineplus.gov/ency/article/007339.htm"]},"1-4-4":{"sections":[{"heading":"내시경과 경피적 접근의 출입구가 다르다","paragraphs":["내시경은 몸의 통로나 개구부 등을 통해 내부를 관찰하는 기구를 활용한다. 경피적 접근은 피부를 통과해 바늘·관·기구 등을 병변 쪽으로 넣는 방법이다. 둘 다 큰 절개 없이 시행될 수 있지만 같은 치료법을 뜻하지 않는다."]},{"heading":"관찰·생검·제거를 구별하기","paragraphs":["위·대장내시경에서는 관찰만 할 수도, 조직을 채취할 수도, 병변을 제거할 수도 있다. 내시경을 했다는 사실만으로 용종절제술이 시행되었다고 볼 수 없다. 검사 결과지와 시술기록에서 행위와 대상 병변을 확인해야 한다."]},{"heading":"EMR·ESD와 기록의 의미","paragraphs":["내시경적 점막절제술과 점막하박리술은 병변의 범위·위치 등 여러 조건을 고려해 선택되는 치료 방법이다. 제거한 조직의 병리 결과와 절제 상태는 이후 치료 계획에 중요하다. 시술명과 최종 병리진단은 별도의 정보로 연결해 읽는다."]},{"heading":"보험 실무 · “시술이라 제외”도 성급하다","paragraphs":["병원에서 시술이라고 부른다는 이유로 모든 수술비에서 제외하거나, 절제라는 이름만으로 모두 포함된다고 설명하지 않는다. 해당 특약의 수술 정의와 분류표, 내시경·경피적 행위 규정, 검사 목적 생검 등의 취급을 실제 기록과 대조한다."]},{"heading":"가상 사례 · 대장 용종 발견과 제거","paragraphs":["대장내시경에서 용종이 발견된 고객에게는 실제 제거 여부, 제거 방법, 병리 결과를 확인한다. 단순 발견·조직 채취·용종 제거를 구분한 뒤, 가입한 수술비와 실손 등에서 어떤 조건을 검토할지 정리한다."]}],"question":"내시경검사와 내시경적 병변 제거는 같은 행위일까?","answer":"아니다. 관찰·조직 채취·치료 목적 제거 여부를 시술기록에서 확인해야 한다.","references":["https://medlineplus.gov/endoscopy.html"]},"1-4-5":{"sections":[{"heading":"카테터는 통로, 스텐트는 지지 장치다","paragraphs":["카테터는 체내에 넣는 가느다란 관으로 검사·약물 투여·치료 기구 전달 등에 쓰인다. 스텐트는 좁아진 통로를 유지하는 장치다. 관상동맥뿐 아니라 다른 혈관이나 담도 등에 쓰일 수 있어 설치 부위와 목적을 먼저 확인해야 한다."]},{"heading":"혈관을 여는 치료와 막는 치료","paragraphs":["풍선확장과 혈관 스텐트는 좁아진 혈관의 흐름을 개선하는 방향으로 이해한다. 색전술은 특정 혈관의 흐름을 차단해 출혈을 조절하거나 병변에 공급되는 혈류를 줄이는 등의 목적으로 시행한다. 둘 다 혈관 안으로 접근해도 작용 방향과 대상 질병이 다르다."]},{"heading":"고주파절제술은 열로 병변을 치료한다","paragraphs":["고주파절제술은 고주파 에너지로 열을 발생시켜 표적 조직을 파괴하는 치료다. 적용 부위와 목적, 접근 방법을 구체적으로 확인한다. 간 종양 치료와 심장 부정맥 치료처럼 비슷한 용어가 쓰여도 서로 다른 치료 상황일 수 있다."]},{"heading":"보험 실무 · 명칭 뒤에 붙여야 할 정보","paragraphs":["질병·장기·치료 목적·실제 행위를 함께 적는다. 담도 스텐트와 관상동맥 스텐트를 같은 담보로 가정하지 않는다. 수술비·특정치료비는 각 약관의 정의와 분류를 확인하고, 재료대의 실제 부담은 비용 서류로 확인한다."]},{"heading":"가상 사례 · 스텐트라는 한 단어","paragraphs":["고객이 “스텐트를 넣었다”고만 말한다면 심장인지 담도인지, 좁아진 원인이 무엇인지, 어떤 처치가 함께 있었는지 확인한다. 심장 스텐트여도 협심증과 심근경색은 구별해야 한다. 장치 사용 사실에서 진단비까지 한 번에 확정하지 않는다."]}],"question":"스텐트·색전술·고주파절제술을 모두 혈관을 넓히는 치료로 볼 수 있을까?","answer":"아니다. 지지·혈류 차단·열에 의한 조직 치료 등 작용과 목적이 다르다.","references":["https://www.radiologyinfo.org/en/info/angioplasty","https://www.radiologyinfo.org/en/info/cathembol","https://www.cancer.gov/about-cancer/treatment/types/surgery"]},"1-4-6":{"sections":[{"heading":"마취는 통증·감각·의식 등을 조절한다","paragraphs":["국소마취는 작은 부위, 부위마취는 더 넓은 신체 영역의 감각을 조절하는 방식이다. 전신마취는 의식과 감각 등을 조절하는 상태를 만든다. 진정은 의식 수준을 낮추는 접근이며 깊이와 시행 방식이 다양하므로 “수면마취”라는 말만으로 세부 방법을 확정하지 않는다."]},{"heading":"회복은 눈을 뜨는 것으로 끝나지 않는다","paragraphs":["수술 뒤에는 호흡·순환·의식·통증·출혈·구역감 등 여러 요소를 관찰한다. 이후 식사·보행·배뇨와 상처 회복, 재활 등도 중요하다. 회복 기간은 수술 범위, 환자 상태와 합병증 등에 따라 달라져 수술 이름 하나로 입원 일수를 정할 수 없다."]},{"heading":"예상되는 불편과 합병증을 구별하기","paragraphs":["수술 뒤 통증이나 일시적인 불편이 있을 수 있지만 감염·출혈·혈전 등은 별도 평가가 필요한 문제다. 합병증 여부는 진단과 치료 기록을 확인한다. 수술 뒤 발생했다는 시간적 순서만으로 모든 질환을 수술 원인으로 단정해서는 안 된다."]},{"heading":"보험 실무 · 마취·입원·간병을 따로 확인하기","paragraphs":["전신마취 여부는 실제 마취 기록으로, 입원은 입퇴원 기록과 담보 요건으로 확인한다. 간병 관련 보장도 실제 이용 및 계약의 요건을 별도로 검토한다. 마취가 있었다고 입원이나 간병 보장이 자동으로 발생하는 것은 아니다."]},{"heading":"가상 사례 · 당일 귀가한 수술","paragraphs":["전신마취 후 수술을 받고 당일 귀가한 고객에게는 실제 입퇴원 처리와 진료 내용을 확인한다. 마취 방식만으로 입원을 확정하지 않으며, 수술비와 입원일당의 조건도 각각 대조한다. 이후 합병증으로 재입원했다면 그 진단·원인·치료를 새 경과로 정리한다."]}],"question":"전신마취를 받으면 입원일당과 간병비도 자동 지급될까?","answer":"아니다. 수술·마취·입원·간병은 서로 다른 사실이며 각 계약의 요건을 확인해야 한다.","references":["https://medlineplus.gov/anesthesia.html","https://www.cancer.gov/about-cancer/treatment/types/surgery"]},"1-5-1":{"sections":[{"heading":"ICD와 KCD는 어떤 관계인가?","paragraphs":["ICD는 WHO의 국제 질병분류체계다. KCD는 한국에서 사용하는 한국표준질병·사인분류다. 질병과 사망원인 등을 일정한 기준으로 분류해 통계와 의료기록 등에 활용한다. 분류체계가 존재한다는 사실과 민영보험의 보장범위가 정해진다는 사실은 구별해야 한다."]},{"heading":"2026년의 판본을 확인하기","paragraphs":["제9차 KCD는 2026년 1월 1일부터 시행되었다. 따라서 과거 교재·진료기록과 현재의 세부코드가 항상 같다고 가정하면 안 된다. 기존 이미지의 ICD-10 표현은 국제 분류의 바탕을 설명하는 맥락으로 읽고, 국내의 현재 세부코드는 KCD 판본을 확인한다."]},{"heading":"코드는 큰 분류에서 세부 내용으로 내려간다","paragraphs":["알파벳과 숫자는 질병군과 하위 항목을 구분한다. 소수점 뒤의 숫자에는 해당 분류에서 정한 세부 의미가 있으며, 코드 전체와 공식 명칭을 함께 봐야 한다. 같은 끝자리 숫자가 모든 질병에서 같은 중증도·부위·진행단계를 뜻하는 것은 아니다."]},{"heading":"보험 실무 · 분류표와 계약의 연결","paragraphs":["민영보험은 실제 계약의 질병 정의와 분류표, 분류 개정 관련 조항 등을 확인한다. 현재 진료에서 쓰는 판본과 계약이 적용하는 분류 기준이 어떤 관계인지 살펴야 한다. “최신 코드니까 기존 보험에도 무조건 그대로 적용된다”는 식으로 일반화하지 않는다."]},{"heading":"가상 사례 · 과거 진단과 새 코드","paragraphs":["과거 진단서와 최근 진단서의 코드가 다르면 질병이 달라졌는지, 세분화나 분류 개정에 따른 차이인지부터 확인한다. 진료 경과와 공식 신구연계 자료를 참고하되, 이를 곧바로 새로운 진단비 지급 사유로 보지 않는다."]},{"heading":"질병코드는 어디에 쓰일까?","paragraphs":["질병코드는 질병이나 건강상태를 일정한 기준으로 분류해 문자와 숫자로 표현한 코드다. 의료기관 진료기록, 건강보험 청구, 의료통계, 연구와 공중보건 정책 등에 활용된다. 민영보험에서는 보장범위를 확인하는 중요한 자료지만, 코드 하나만으로 보험금 지급이 자동 결정되지는 않는다."]},{"heading":"코드 전체를 읽는 예 · I21.9","paragraphs":["기존 교재의 예시 I21.9에서 I는 질병 분류 영역, 21은 범주, 소수점 이하 9는 세부 분류를 나타낸다. I21은 급성심근경색증 범주다. 코드의 앞자리만으로 같은 질병이라고 단정하지 말고, 소수점 이하 코드와 적용 판본의 공식 명칭을 함께 확인한다.","기존 요약 이미지에는 제작 당시의 KCD-8 표기가 남아 있다. 현재 적용 판본과 계약에 적용되는 분류 기준은 이 장의 본문 및 공식 분류 자료를 기준으로 확인한다."]},{"heading":"심장질환 코드로 보는 분류의 차이","paragraphs":["기존 교재에서 비교한 범주는 I20 협심증, I21 급성심근경색증, I25 만성 허혈성 심장질환, I48 심방세동 및 조동, I50 심부전이다. 이들을 모두 같은 심장병으로 묶어 보장 여부를 판단하지 않는다.","스텐트 삽입 사실과 급성심근경색 진단은 구별해야 한다. 심방세동 및 조동은 부정맥 담보의 세부 보장범위를, 심부전은 심근경색·부정맥과 다른 진단이라는 점을 각각 확인한다. 모든 판단에는 실제 계약의 질병 정의와 진단확정 요건을 함께 대조한다."]},{"heading":"주상병·부상병과 진단의 확실성","paragraphs":["주상병은 해당 진료에서 주된 진단으로 분류된 질병이고, 부상병은 함께 존재하거나 진료에 영향을 준 다른 질병 등이다. 구체적인 선정 기준은 진료 환경과 코딩 지침에 따라 다를 수 있다. 예를 들어 폐렴 입원에서 폐렴이 주상병, 기존 당뇨병과 고혈압이 부상병으로 기록될 수 있다.","부상병이라고 해서 무조건 미확정 진단은 아니며, 주상병이라고 약관상 진단확정 요건이 자동 충족되는 것도 아니다. 의증은 질병을 의심하며 평가 중인 상태이고, 확정진단은 의사가 진단 근거를 종합해 질병으로 진단한 상태다. 초기 의심 코드와 최종 진단을 구별한다."]},{"heading":"가상 사례 · 스텐트, 부상병, 의증 기록","paragraphs":["다음은 기존 교재의 사례를 글로 옮긴 학습용 가상 예시다. 관상동맥 스텐트를 삽입했고 최종 진단이 I20 범주인 경우, 시술 사실만으로 I21 급성심근경색 진단비를 단정하지 않는다.","폐렴이 주상병이고 당뇨병이 부상병인 경우에도 각 질병의 확정 여부와 검사 근거, 약관 조건을 따로 확인한다. 응급실에서 뇌졸중 의증으로 기록된 뒤 최종 진단이 바뀌었다면, 초기 의증 코드만 보지 말고 최종 진단과 영상검사 결과를 확인한다."]},{"heading":"질병코드를 읽는 보험 실무 체크리스트","paragraphs":["① 진단명과 코드를 함께 확인한다. ② 주상병·부상병의 구분을 확정 여부와 혼동하지 않는다. ③ 의증과 확정진단을 구별한다. ④ 약관의 질병분류표를 확인한다. ⑤ 검사 등 진단확정 요건을 확인한다. ⑥ 적용 KCD 판본과 약관의 분류 개정 규정을 확인한다.","질병코드는 질병을 분류하는 기준이다. 실제 보험금 판단에서는 코드뿐 아니라 진료 내용, 의학적 근거, 해당 약관의 보장범위와 진단확정 요건을 종합해서 확인한다."]}],"question":"KCD가 개정되면 모든 기존 계약의 보장범위도 자동으로 같아질까?","answer":"그렇게 단정할 수 없다. 해당 계약의 질병분류표와 분류 개정 관련 조항을 확인해야 한다.","references":["https://www.who.int/standards/classifications/classification-of-diseases/","https://www.law.go.kr/admRulLsInfoP.do?admRulSeq=2100000260878","https://www.hira.or.kr/rc/drug/insuadtcrtr/bbsView.do?brdBltNo=53037&brdScnBltNo=4&pgmid=HIRAA030069000400"]},"1-5-2":{"sections":[{"heading":"첫 글자는 탐색의 출발점이다","paragraphs":["A·B는 감염성질환의 여러 항목, I는 순환계질환, J는 호흡계질환, K는 소화계질환 등의 큰 방향을 파악하는 단서다. 그러나 각 장의 전체 범위와 예외는 공식 분류표를 확인해야 한다. 첫 글자를 외우는 것으로 진단이나 보장 판독이 끝나지 않는다."]},{"heading":"C와 D를 단순히 암·비암으로 나누지 않기","paragraphs":["신생물 분류에는 악성, 제자리, 양성, 행동양식이 불명확한 경우 등이 구별된다. D로 시작하는 영역은 신생물 일부뿐 아니라 다른 분류와도 이어지므로 “D는 모두 소액암”이라는 식의 설명은 틀리다. 진단명과 세부 분류 및 해당 약관을 확인해야 한다."]},{"heading":"R·Z·U의 의미를 놓치지 않기","paragraphs":["R 계열에는 달리 분류되지 않은 증상·징후·검사 이상 등의 항목이 있고, Z 계열은 건강상태나 보건서비스 접촉과 관련된 여러 요인을 표현한다. U 계열은 특수목적 코드다. 이들 역시 첫 글자만으로 질병 유무나 모든 보험의 지급 가능·불가를 결정할 수 없다."]},{"heading":"소수점 뒤 숫자는 공식 명칭으로 읽기","paragraphs":["예시 코드 I21.9는 급성심근경색의 상세불명 항목을 설명한다. 끝의 .9를 중증도 9단계나 경증 표시로 읽지 않는다. “기타”와 “상세불명”도 서로 다른 분류 의미가 있으므로 전체 코드와 명칭을 공식 분류에서 확인한다."]},{"heading":"가상 사례 · 갑상선 병변의 코드","paragraphs":["갑상선에 병변이 있다는 말만으로 갑상선암이라고 분류하지 않는다. 기능 이상·결절·염증·양성 종양·악성 종양 등 실제 진단을 먼저 확인한다. 같은 장기에 생겼다는 사실보다 병변의 성격과 진단 근거가 코드와 담보를 연결하는 핵심이다."]}],"question":"D로 시작하면 모두 제자리암이나 소액암이라고 설명해도 될까?","answer":"안 된다. 전체 코드·공식 진단명·분류 범위와 해당 계약의 보장 정의를 확인해야 한다.","references":["https://www.who.int/standards/classifications/classification-of-diseases/","https://kostat.go.kr/boardDownload.es?bid=246&list_no=437418&seq=1"]},"1-5-3":{"sections":[{"heading":"주상병은 가장 무서운 병이라는 뜻이 아니다","paragraphs":["주상병은 해당 진료 상황에서 주된 진료 이유로 선정되는 진단이다. 질병 자체의 평생 중요도나 보험금의 크기를 순위 매긴 것이 아니다. 외래·입원 등 진료 맥락과 코딩 지침에 따라 판단하며, 진단서의 인쇄 순서만으로 의학적 확정 여부나 보험상 중요도를 정하지 않는다."]},{"heading":"부상병도 확정된 질병일 수 있다","paragraphs":["함께 존재하거나 진료에 영향을 주는 다른 질병이 부상병으로 기록될 수 있다. 폐렴 입원 환자에게 당뇨병이 함께 관리되는 상황을 생각하면 쉽다. 뒤에 적힌 코드라는 이유만으로 무효가 되거나 모든 진단비에서 제외되는 것은 아니다."]},{"heading":"의증과 확정진단의 차이","paragraphs":["의증은 의심하는 단계이고, 확정진단은 해당 질병으로 판단한 단계다. 다만 서류 한 칸의 표기만으로 끝내지 않고 실제 검사·경과와 최종 진단을 확인한다. 입원 코딩에서 다루는 불확실한 진단의 규칙과 민영보험이 정한 진단확정 조건도 동일한 개념으로 취급하지 않는다."]},{"heading":"보험 실무 · 순서보다 진단의 근거","paragraphs":["확인 순서는 해당 질병이 실제 확정되었는지, 어떤 검사 근거가 있는지, 가입 담보에 포함되는지, 진단확정과 계약조건을 충족하는지다. 주상병이면 무조건 지급, 부상병이면 무조건 부지급이라는 방식은 사용할 수 없다."]},{"heading":"가상 사례 · 폐렴 입원 중 당뇨 관리","paragraphs":["폐렴을 주된 이유로 입원한 환자의 부상병에 당뇨병이 기록되어 있다고 하자. 당뇨가 과거부터 있던 진단인지 새로 확정된 것인지, 검사와 치료가 무엇인지 확인한다. 부상병이라는 위치보다 실제 진단·시점과 당뇨 관련 담보의 구체 요건이 중요하다."]}],"question":"진단서 두 번째 줄의 부상병이면 진단비를 검토할 필요가 없을까?","answer":"아니다. 부상병도 확정질병일 수 있으므로 진단 근거·시점·약관 요건으로 검토해야 한다.","references":["https://www.who.int/standards/classifications/classification-of-diseases/","https://www.law.go.kr/admRulLsInfoP.do?admRulSeq=2100000260878"]},"1-5-4":{"sections":[{"heading":"질병분류표는 보장대상을 찾는 지도다","paragraphs":["진단서의 질병코드는 의학적 분류를 나타내고, 약관의 질병분류표는 계약이 정한 보장대상의 범위를 보여 준다. 같은 질병 이름이 여러 담보에 언급되어도 범위와 진단 요건은 다를 수 있다. 담보명만 기억하기보다 실제 표와 정의 조항을 함께 읽어야 한다."]},{"heading":"코드가 들어 있으면 다음 조건도 확인한다","paragraphs":["분류표 포함 여부는 중요한 출발점이지만 검토가 끝나는 지점은 아니다. 약관에서 정한 진단확정 방법, 보장개시와 면책·감액, 지급횟수, 특정 치료 등의 조건이 있을 수 있다. 실제 가입한 상품·특약·가입 시점의 문서를 기준으로 확인한다."]},{"heading":"코드와 조직학적 성격을 함께 읽기","paragraphs":["예를 들어 유방의 제자리암과 침윤성 유방암은 같은 부위라도 질병의 성격과 코드 분류가 다르다. 병리 결과와 최종 진단을 확인하고 계약에서 각 범주를 어떻게 다루는지 대조한다. 장기의 이름이 같다는 이유로 동일 담보와 금액을 적용하지 않는다."]},{"heading":"실무 메모를 만드는 다섯 칸","paragraphs":["가입 담보, 최종 진단명·전체 코드, 의학적 근거, 약관의 해당 정의·분류 항목, 아직 확인하지 못한 조건을 적는다. 특히 자료가 없는 항목은 추정으로 채우지 말고 확인 필요로 남긴다. 이 방식이면 고객에게 가능성과 미확인 사항을 구분해 설명할 수 있다."]},{"heading":"가상 사례 · 협심증과 심근경색 담보","paragraphs":["협심증 진단을 받은 고객의 계약에 급성심근경색 관련 담보와 허혈성심장질환 관련 담보가 있다면 각각의 범위와 진단 요건을 확인한다. 심장이라는 부위나 혈관 시술 사실만으로 두 담보가 모두 해당한다고 안내하지 않는다."]}],"question":"질병분류표에 코드가 포함되면 그 즉시 지급 확정일까?","answer":"아니다. 진단확정 요건과 보장개시·지급횟수 등 해당 계약의 다른 조건도 확인해야 한다.","references":["https://www.who.int/standards/classifications/classification-of-diseases/","https://www.law.go.kr/admRulLsInfoP.do?admRulSeq=2100000260878"]},"1-5-5":{"sections":[{"heading":"코드 변경에는 서로 다른 이유가 있다","paragraphs":["추가 검사로 질병 판단이 달라지는 경우, 같은 질병을 더 구체적으로 적는 경우, 문서 오류를 정정하는 경우, 분류 개정으로 코드가 달라지는 경우를 나눈다. 숫자가 달라졌다는 사실만으로 병이 새로 생겼거나 예전 진단이 모두 틀렸다고 볼 수 없다."]},{"heading":"여러 코드가 있으면 사건을 분리한다","paragraphs":["원인 질환과 합병증, 함께 관리하는 질병, 서로 다른 진료일의 기록이 함께 보일 수 있다. 코드를 몇 개 가지고 있는지가 보험금의 개수와 바로 일치하지 않는다. 각각 어떤 질병과 진료 경과를 설명하는지 정리하고 동일 사건·동일 치료의 지급 규정을 확인한다."]},{"heading":"분류 개정과 실제 진단 변경을 구별하기","paragraphs":["2026년에는 KCD 제9차 개정이 시행되었다. 과거 코드가 현재 다른 코드로 대응된다고 해도 새로운 질병 발생을 뜻하는 것은 아니다. 공식 신구연계 자료는 분류 차이를 이해하는 참고자료이며, 민영계약의 보장범위와 적용 판본은 약관 조항으로 확인한다."]},{"heading":"보험 실무 · 변경 전후를 함께 보존하기","paragraphs":["기존 문서, 수정 문서, 변경된 항목과 이유, 의학적 근거, 확정 시점을 함께 정리한다. 보험금에 유리한 코드로 임의 변경을 요청하는 방식이 아니라 실제 진단을 정확히 반영하도록 사실관계를 확인해야 한다. 지급·추가지급·환수 여부는 문서 변경만으로 확정하지 않는다."]},{"heading":"가상 사례 · 최초 의심과 최종 병리","paragraphs":["영상에서 악성 병변을 의심했으나 최종 병리에서 제자리 병변으로 확정되었다면 최초 의심과 최종 진단의 차이를 기록한다. 반대로 추가 평가로 침윤성이 확인된 경우도 근거와 날짜를 살펴야 한다. 어느 경우든 코드 한 줄 대신 최종 진단과 계약의 분류·확정 요건을 대조한다."]}],"question":"코드가 바뀌면 새 진단비도 반드시 한 번 더 발생할까?","answer":"아니다. 변경 사유, 실제 질병과 시점, 계약의 동일 질병·재진단·지급횟수 규정을 검토해야 한다.","references":["https://www.hira.or.kr/rc/drug/insuadtcrtr/bbsView.do?brdBltNo=53037&brdScnBltNo=4&pgmid=HIRAA030069000400","https://www.law.go.kr/admRulLsInfoP.do?admRulSeq=2100000260878"]},"1-5-6":{"sections":[{"heading":"실전 판독은 진단서에서 끝나지 않는다","paragraphs":["진단서의 최종 진단명과 코드를 읽고, 이를 뒷받침하는 검사·병리·영상 등의 근거를 확인한다. 다음으로 실제 가입 담보와 약관의 질병 정의·분류표를 연결한다. 마지막으로 진단확정 방법, 보장개시와 면책·감액, 지급횟수 등 조건을 확인한다."]},{"heading":"사례 1 · 제자리 유방 병변과 침윤성 유방암","paragraphs":["D05와 C50은 유방 관련 코드라는 공통점이 있지만 병변의 분류가 다르다. 조직검사의 병리 진단과 최종 확정 여부를 확인해야 한다. 단순히 “유방암 수술”이라는 설명만으로 일반암·제자리암 범주나 지급액을 확정하지 않는다."]},{"heading":"사례 2 · 뇌경색과 MRI 촬영","paragraphs":["어지럼으로 MRI를 찍은 사실, 영상에서 경색 소견이 언급된 사실, 뇌경색으로 최종 진단된 사실은 서로 구별한다. I63 등 코드가 기록되어도 해당 계약의 진단확정 요건을 충족하는지 확인한다. 치료비는 실제 시행한 혈전용해·혈전제거 등의 행위가 별도로 중요하다."]},{"heading":"사례 3 · 스텐트와 급성심근경색","paragraphs":["관상동맥 시술은 협심증 등에서도 시행될 수 있으므로 시술 사실이 곧 I21 급성심근경색 확정을 뜻하지 않는다. 최종 진단과 심전도·심근표지자 등 근거를 확인한다. 진단비, 수술비, 특정치료비를 각각의 조건으로 나누어 검토한다."]},{"heading":"사례 4 · 부상병에 기록된 당뇨병","paragraphs":["부상병에 적힌 당뇨병도 확정된 질병일 수 있다. 다만 새 진단인지 기존 질병인지, 어떤 검사가 근거인지, 계약이 어떤 상태를 보장하는지를 확인해야 한다. 코드의 위치와 개수가 지급결론을 대신하지 않는다."]},{"heading":"고객 설명문을 완성하는 방법","paragraphs":["“현재 확인된 사실은 ○○이고, 해당 담보에서는 △△를 확인해야 합니다. 아직 부족한 자료는 □□입니다”라는 구조로 안내한다. 지급 가능성과 확정을 섞지 않고, 확인한 근거와 남은 질문을 분리하면 과장과 누락을 줄일 수 있다. 이 장의 사례는 모두 학습을 위한 가상 사례다."]}],"question":"진단서 코드를 확인한 다음에 해야 할 세 가지는?","answer":"의학적 근거 확인, 실제 가입 담보의 정의·분류표 대조, 진단확정 및 계약조건 검토다.","references":["https://www.who.int/standards/classifications/classification-of-diseases/","https://www.law.go.kr/admRulLsInfoP.do?admRulSeq=2100000260878","https://www.cancer.gov/about-cancer/diagnosis-staging/diagnosis","https://medlineplus.gov/lab-tests/troponin-test/"]},"1-6-1":{"sections":[{"heading":"학습 목표 · 진료와 비용을 나누어 읽기","paragraphs":["병원에서 받은 진료, 건강보험이 적용되는 범위, 환자가 실제 낸 돈, 민영보험에서 보상하는 돈은 각각 확인할 대상이다. 이 장에서는 진료비 영수증의 큰 구조를 익히고 다음 장에서 다룰 진료비 세부내역을 읽는 바탕을 만든다.","접수와 진찰 뒤에는 환자 상태에 따라 검사·처방·처치·수술·입원 등이 이어질 수 있다. 모든 환자가 같은 순서를 거치는 것은 아니다. 의학적 판단은 증상과 검사 결과 등에 근거하며, 수납한 금액만으로 질병의 중증도나 진단확정 여부를 판단할 수 없다."]},{"heading":"급여 · 공단부담과 환자 부담의 구분","paragraphs":["급여는 국민건강보험이 적용되는 진료 항목이다. 일반적인 일부부담 구조에서는 급여 진료비를 공단이 부담하는 부분과 환자가 부담하는 부분으로 나눈다. 따라서 영수증에 적힌 급여 총액이 곧 환자가 낸 금액은 아니다.","실제 본인부담은 입원·외래, 의료기관 종류, 환자 자격과 적용 제도, 진료 항목 등에 따라 달라진다. 선별급여 등에는 별도 부담률이 적용될 수 있다. 하나의 비율을 모든 진료에 적용하거나 이 장의 가상 계산을 법정 비율로 설명하지 않는다."]},{"heading":"“전액비급여”라는 말을 들었다면 · 무엇을 전액 낸다는 뜻일까?","paragraphs":["비급여는 국민건강보험이 적용되지 않는 진료 항목으로, 원칙적으로 그 항목의 비용 전액을 환자가 부담한다. 예를 들어 비급여로 산정된 검사 비용이 2만원이면 그 2만원을 환자가 부담한다. 여기서 “전액”은 해당 항목의 비용을 말한다. 같은 날 받은 다른 급여 진료까지 모두 비급여가 된다는 뜻은 아니다.","“전액비급여”라는 말만으로 별도의 비용 분류가 확정되는 것은 아니다. 비급여 비용을 전부 부담한다는 설명인지, 급여의 전액본인부담을 부정확하게 부르는 것인지 먼저 확인한다. 실무에서는 “영수증의 비급여 칸에 적힌 금액인가요, 급여의 전액본인부담 칸에 적힌 금액인가요?”라고 질문하면 혼동을 줄일 수 있다.","비급여에는 치료 목적의 항목도 있을 수 있으므로 비급여라는 이유만으로 불필요한 치료나 미용 진료로 단정하지 않는다. 반대로 환자가 원하거나 치료에 필요하다는 이유만으로 모든 항목이 급여가 되는 것도 아니다. 해당 진료의 목적과 적용 기준을 함께 확인한다."]},{"heading":"급여의 전액본인부담 · 환자가 100% 내도 비급여와 다르다","paragraphs":["급여의 전액본인부담은 적용 규정에 따라 급여 비용의 100%를 환자가 부담하는 경우를 말한다. 100분의 100 본인부담이라고도 한다. 환자가 모두 낸다는 점은 비급여와 같아 보이지만, 급여 체계 안의 비용인지 비급여 비용인지 분류가 다르다.","비교하면 급여의 일부본인부담은 공단과 환자가 정해진 기준에 따라 나누어 내는 구조, 급여의 전액본인부담은 급여 기준에 따라 환자가 전부 내는 구조, 비급여는 건강보험이 적용되지 않는 해당 항목 비용을 환자가 부담하는 구조다. “내 돈을 얼마나 냈는가”와 “어떤 기준으로 산정된 비용인가”를 구분해야 한다.","급여의 전액본인부담은 관련 급여 산정 기준에 따라 비용을 확인하고, 비급여는 의료기관이 정한 항목별 가격 등을 확인한다. 급여 혜택을 받지 못한다는 이유만으로 병원이나 환자가 마음대로 비급여 또는 전액본인부담으로 바꾸어 적용할 수 있는 것은 아니다. 불명확하면 항목명·코드·적용 근거를 의료기관에 문의한다."]},{"heading":"가상 비교 사례 · 같은 2만원이어도 확인할 칸이 다르다","paragraphs":["가상의 환자 지수 씨와 현우 씨가 각각 2만원을 전액 냈다고 하자. 지수 씨의 영수증에는 급여의 전액본인부담 2만원, 현우 씨의 영수증에는 비급여 2만원이 적혀 있다고 가정한다. 두 사람의 지출은 같지만 비용 분류는 다르다. 실제 진료 항목과 적용 기준을 특정하지 않은 학습용 비교이며, 어느 검사나 약제가 해당한다고 단정하는 예가 아니다.","보험 상담에서는 “둘 다 전액 냈으니 같은 비급여”라고 묶지 않는다. 각 영수증과 세부내역으로 분류를 확인하고 실제 가입한 실손보험의 보상대상·제외사항·공제·한도와 대조한다. 전액본인부담이면 반드시 보상되거나, 비급여이면 모두 보상되지 않는다고 결론 내리지 않는다."]},{"heading":"영수증과 세부산정내역서를 함께 읽기","paragraphs":["진료비 계산서·영수증은 급여·비급여 등의 비용 구분과 수납액을 확인하는 자료다. 카드 매출전표는 결제 사실을 보여주지만 어떤 진료에 얼마가 산정되었는지까지 충분히 설명하지 못한다.","세부산정내역서는 검사·약제·처치 등의 항목, 단가와 횟수 등을 확인하는 자료다. 영수증과 진료 기간·환자·합계가 맞는지 살펴보고, 불명확한 항목은 의료기관에 설명을 요청한다. 이미 낸 금액, 미납·환불·할인 등이 있으면 환자 부담 총액과 이번 수납액이 다를 수 있다.","비급여나 전액본인부담으로 낸 비용이 건강보험 대상인지 의문이 있으면 심평원의 진료비 확인 제도를 살펴볼 수 있다. 이 절차와 민영보험 보험금 심사는 목적과 판단 기준이 다르다."]},{"heading":"가상 사례 · 진료비 총액 12만원과 환자 부담 5만원","paragraphs":["가상의 환자 민수 씨가 외래 진료를 받았다. 구조를 설명하기 위해 급여 총액 10만원 중 공단부담금은 7만원, 급여 본인부담금은 3만원으로 가정한다. 여기에 비급여 2만원이 있고 다른 조정이나 미납이 없다면 전체 진료비는 12만원이며, 환자가 부담할 금액은 3만원 + 2만원 = 5만원이다. 이 금액과 비율은 교육용 가정이며 실제 적용 기준을 뜻하지 않는다.","민수 씨가 5만원을 냈다는 사실만으로 실손보험금도 5만원이라고 안내해서는 안 된다. 실제 보상대상 비용인지, 공제와 한도는 무엇인지, 다른 계약과의 관계는 어떤지 등을 가입한 약관에 따라 확인해야 한다. 진단비 역시 수납액이 아니라 해당 담보의 진단확정 등 지급요건으로 별도 판단한다."]},{"heading":"보험 실무 · 사실을 먼저 정리하고 계약과 대조하기","paragraphs":["상담에서는 진료일과 진료 형태, 시행 항목, 영수증상 비용 구분, 환자의 실제 부담액을 먼저 정리한다. 다음으로 가입한 담보와 적용 약관을 대조한다. 급여이면 무조건 보장되거나 비급여이면 무조건 제외된다고 설명하지 않는다.","“현재 영수증상 환자 부담은 5만원입니다. 보상대상 항목과 공제·한도는 가입한 실손 약관을 확인하겠습니다. 진단비는 진단확정 자료와 담보 요건을 따로 검토하겠습니다”처럼 확인한 사실과 남은 검토를 구분하면 된다. 이 사례는 지급을 약속하는 예가 아니다."]},{"heading":"핵심 요약 · 세 단계로 기억하기","paragraphs":["진료비를 급여·비급여 등으로 구분한다 → 영수증과 세부내역으로 실제 환자 부담을 확인한다 → 가입한 보험약관의 보상대상·공제·한도를 대조한다. 진료비 총액, 환자 부담액, 보험금은 서로 다른 금액일 수 있다."]}],"question":"① 비급여 2만원을 전액 냈다면 그날 병원비 전체가 비급여일까? ② 급여의 전액본인부담 2만원과 비급여 2만원은 같은 분류일까? ③ 급여 총액 10만원(공단 7만원·본인 3만원)에 비급여 2만원이 추가되면 환자 부담과 보험금은 얼마일까?","answer":"① 아니다. 전액 부담은 해당 비급여 항목 비용에 관한 설명이며 다른 급여 진료까지 비급여가 되는 것은 아니다. ② 아니다. 환자가 낸 돈은 같아도 급여의 전액본인부담과 비급여는 다른 분류다. 영수증의 해당 칸과 세부내역을 확인한다. ③ 다른 조정이 없다면 환자 부담은 3만원 + 2만원 = 5만원이다. 실제 민영보험금은 보상대상, 공제·한도와 담보별 지급요건 등을 가입 계약으로 확인하므로 이 정보만으로 확정할 수 없다. 예시의 비율은 실제 법정 부담률이 아니다.","references":["https://www.nhis.or.kr/static/html/wbma/c/wbmac0103.html","https://www.nhis.or.kr/nbinfo/htmc_under.do","https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=285513","https://www.hira.or.kr/rb/npay/index.do?pgmid=HIRAA070003000001","https://www.hira.or.kr/ebooksc/2023/07/BZ202307058814745.pdf","https://www.hira.or.kr/bbsDummy.do?brdBltNo=47476&brdScnBltNo=4&pgmid=HIRAA010006011000"]},"1-6-2":{"sections":[{"heading":"두 문서의 역할 · 얼마를 냈는지와 무엇에 썼는지","paragraphs":["제1장에서 진료비의 급여·비급여 구조를 배웠다면, 이번에는 실제 문서에서 그 구조를 찾는다. 진료비 계산서·영수증은 비용의 구분과 환자 부담, 납부 내역을 확인하는 출발점이다. 세부산정내역서는 검사·약제·처치 등 어떤 항목에 비용이 산정되었는지 살펴보는 자료다.","카드 매출전표는 결제 사실을 보여주지만 급여·비급여와 개별 진료 항목을 충분히 설명하지 못한다. 반대로 세부내역서만으로 실제 납부와 환불이 모두 끝났다고 단정할 수도 없다. 영수증과 세부내역서를 같은 진료 범위로 맞춰 읽는다."]},{"heading":"읽는 순서 1 · 환자와 진료 기간부터 맞추기","paragraphs":["금액보다 먼저 환자, 의료기관, 진료 기간을 확인한다. 입원인지 외래인지, 특정 방문만 포함하는지 여러 날을 합친 것인지 살펴본다. 문서의 발급일과 실제 진료일은 다를 수 있다. 개인정보는 확인에 필요한 범위에서 다룬다.","입원 중간 정산 영수증과 퇴원 시 최종 정산 영수증은 포함 범위가 겹칠 수 있다. 같은 문서를 재발급받은 경우도 새로운 지출이 생긴 것은 아니다. 문서 장수나 발급 횟수를 그대로 진료 횟수나 지출 횟수로 세지 않는다."]},{"heading":"읽는 순서 2 · 급여와 비급여 칸을 분리하기","paragraphs":["급여의 일부본인부담은 본인부담금과 공단부담금을 구분해 읽고, 급여의 전액본인부담과 비급여도 각각 확인한다. 공단부담금은 환자가 병원에 낸 돈과 구분해야 한다. 환자가 전액 냈다는 이유만으로 급여의 전액본인부담을 비급여로 바꾸어 읽지 않는다.","단순한 예에서는 환자부담총액을 급여 본인부담금, 급여 전액본인부담금, 비급여의 합으로 이해할 수 있다. 다만 실제 문서에서는 할인·지원·환불 등 별도 표시와 적용 범위를 함께 확인해야 한다. 진료비 총액과 환자부담총액을 같은 뜻으로 쓰지 않는다."]},{"heading":"읽는 순서 3 · 환자부담총액과 이번 수납액을 구별하기","paragraphs":["환자부담총액은 해당 문서의 진료 범위에서 환자가 부담할 전체 금액이고, 이번에 납부할 금액이나 수납액은 이미 납부한 금액과 미납·정산 등을 반영해 달라질 수 있다. 실제로 얼마를 냈는지는 납부 내역과 이후 환불·정정까지 확인한다.","특히 “중간에 낸 돈 + 최종 영수증의 환자부담총액”을 무조건 더하면 중간 납부액을 두 번 계산할 수 있다. 최종 문서가 앞선 진료와 납부를 포함하는지 먼저 확인한다. 합계가 맞지 않으면 중간·최종 정산 관계를 의료기관에 문의한다."]},{"heading":"읽는 순서 4 · 세부내역서의 한 줄을 따라가기","paragraphs":["세부내역서는 일자, 항목명과 코드, 단가 또는 금액, 횟수·일수, 총액과 비용 구분을 따라 읽는다. 예를 들어 단순 계산 연습으로 1회 금액 5천원, 하루 2회, 3일이면 5천원 × 2회 × 3일 = 3만원이다. 실제 수가나 특정 치료 가격을 제시한 예가 아니다.","실제 내역은 가산·끝수처리·묶음 산정 등으로 단순 곱셈만으로 설명되지 않을 수 있다. 횟수와 일수가 무엇을 뜻하는지도 해당 서식과 항목에 맞춰 확인한다. 특히 포괄수가 등은 세부내역 제공 범위가 일반적인 행위별 내역과 다를 수 있다. 숫자가 예상과 다르다는 이유만으로 바로 과다 청구라고 단정하지 않는다.","진료비 항목의 코드는 질병코드와 구별한다. 검사나 처치 비용이 기록되었다는 사실은 해당 질병의 최종 확정이나 약관상 수술 요건 충족을 자동으로 뜻하지 않는다. 필요한 경우 진료기록과 검사 결과 등으로 실제 시행 내용과 진단을 확인한다."]},{"heading":"가상 사례 · 총부담 6만원, 이번 납부 4만원","paragraphs":["가상의 환자 서연 씨의 최종 정산 자료에 급여 본인부담 3만원, 급여 전액본인부담 1만원, 비급여 2만원이 적혀 있다고 가정한다. 환자부담총액은 3만원 + 1만원 + 2만원 = 6만원이다. 다른 조정이나 미납이 없고 앞서 2만원을 납부했다면 이번에 낼 돈은 6만원 − 2만원 = 4만원이다.","서연 씨가 가진 중간 영수증 2만원과 최종 환자부담총액 6만원을 더해 지출을 8만원으로 계산하면 잘못이다. 이 사례에서는 앞서 낸 2만원과 이번 납부 4만원을 합한 6만원이 전체 부담이다. 금액과 비용 분류는 문서 읽기를 위한 가정이며 실제 진료 항목의 적용 기준이나 부담률을 뜻하지 않는다."]},{"heading":"보험 실무 · 항목 확인과 지급 판단을 나누기","paragraphs":["먼저 진료 범위와 문서 중복 여부를 맞추고, 영수증의 비용 구분과 세부내역의 해당 범주 합계를 대조한다. 세부내역의 전체 총액에는 공단부담분이 포함될 수 있으므로 이를 환자 지출과 바로 비교하지 않는다. 항목별 합계와 정산 내역이 다르면 설명이나 정정 자료를 요청한다.","그다음 실제 가입한 담보의 보상대상·제외사항·공제·한도를 확인한다. 세부내역서에 항목이 있다는 것만으로 실손 보상이나 수술비 지급이 확정되지 않는다. 진단비는 최종 진단과 담보의 진단확정 요건 등을 별도로 검토한다. 보험회사별·청구 내용별 필요한 자료도 확인한다.","고객에게는 “최종 환자부담총액은 6만원이고, 앞서 낸 2만원을 반영하면 이번 납부는 4만원입니다. 비용 항목과 가입 약관을 대조해 보상 여부를 확인하겠습니다”처럼 확인한 사실과 남은 검토를 나누어 설명한다. 이 사례는 특정 계약의 보험금 지급을 약속하지 않는다."]},{"heading":"추가 장표 해설 · 가상 영수증의 다섯 표시 읽기","paragraphs":["추가 이미지는 실제 발급 문서가 아니라 읽는 방법을 익히기 위한 단순화된 교육용 영수증이다. ① 환자·의료기관·진료기간과 최종 정산 여부부터 확인한다. ② 공단부담금 7만원은 전체 진료비에 포함되지만 환자가 직접 낸 돈에서는 구분한다. ③ 급여 전액본인부담 1만원과 비급여 2만원은 각각의 칸으로 읽는다.","④ 급여 본인부담 3만원 + 급여 전액본인부담 1만원 + 비급여 2만원 = 환자부담총액 6만원이다. 여기에 공단부담 7만원을 더한 전체 진료비는 13만원이다. ⑤ 앞서 낸 2만원을 반영하면 이번 납부는 4만원이다. 할인·지원·환불·미납 등 다른 조정이 없다고 가정한 사례이며, 실제 부담률·수가나 보험금 지급액을 뜻하지 않는다."]},{"heading":"핵심 요약 · 범위 → 구분 → 항목 → 정산","paragraphs":["같은 진료 범위의 문서를 준비한다 → 급여 본인부담·공단부담·전액본인부담·비급여를 나누어 읽는다 → 세부 항목과 해당 범주의 합계를 대조한다 → 이미 낸 돈과 미납·환불 등 정산을 확인한다. 진료비 총액, 환자부담총액, 이번 수납액을 구분하면 중복 계산과 상담 오류를 줄일 수 있다."]}],"question":"최종 영수증의 환자부담총액이 6만원이고 이미 납부한 금액이 2만원이다. 다른 조정이나 미납이 없다면 ① 이번에 낼 돈은 얼마인가? ② 중간 영수증 2만원과 최종 총액 6만원을 합쳐 지출을 8만원으로 보아도 되는가? ③ 세부내역에 처치 항목이 있으면 약관상 수술비 지급도 확정되는가?","answer":"① 6만원에서 이미 낸 2만원을 뺀 4만원이다. ② 아니다. 이 사례의 최종 총액에는 중간 납부가 반영되므로 전체 부담은 2만원 + 4만원 = 6만원이다. 문서 범위와 정산 관계를 확인해 중복을 피한다. ③ 아니다. 실제 시행 내용과 해당 약관의 수술 정의·지급요건 등을 별도로 확인해야 한다.","references":["https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=285513","https://www.law.go.kr/admRulInfoP.do?admRulSeq=2100000117269","https://www.hira.or.kr/bbsDummy.do?bltNo=63&brdBltNo=45050&brdScnBltNo=4&brdTyBltNo=3&pgmid=HIRAA010003001000","https://www.hira.or.kr/rb/npay/index.do?pgmid=HIRAA070003000001"]},"1-6-3":{"sections":[{"heading":"서류는 이름보다 증명할 사실로 이해하기","paragraphs":["보험금 청구서류는 비용, 진단, 치료 행위, 입원·통원 기간, 청구 권한 등을 확인하기 위한 자료다. 같은 진료라도 실손의료비·진단비·수술비·입원일당은 확인할 사실이 다르므로 필요한 자료도 달라질 수 있다. 이 장은 일반적인 서류의 역할을 설명하며 모든 회사·상품에 공통된 필수 목록을 제시하는 것은 아니다.","준비 순서는 청구할 담보 확인 → 증명해야 할 사실 정리 → 보험회사 최신 안내에서 필수 기재사항과 대체·생략 가능 여부 확인 → 의료기관에 발급 요청이다. 서류가 많을수록 유리한 것은 아니다. 같은 정보가 이미 있는지 먼저 확인하면 중복 발급을 줄일 수 있다."]},{"heading":"진료비 계산서·영수증 · 얼마를 부담하고 납부했는가","paragraphs":["급여 본인부담·공단부담·급여 전액본인부담·비급여 등 비용 구분과 환자부담총액, 납부 내역을 확인하는 자료다. 실손의료비에서는 실제 부담 비용을 검토하는 출발점이 된다. 중간·최종 정산과 환불 여부도 함께 살핀다.","카드 매출전표는 결제 사실을 보여주지만 어떤 비용인지 충분히 설명하지 못한다. 연말정산용 납입확인서도 개별 진료의 항목·비용 구분을 대신하지 못할 수 있다. 보험회사가 요구하는 진료비 계산서·영수증인지 확인한다. 영수증만으로 최종 진단이나 약관상 수술 해당 여부를 확정하지 않는다."]},{"heading":"진료비 세부산정내역서 · 무엇에 얼마가 산정되었는가","paragraphs":["진료일, 항목명·코드, 금액·횟수·일수, 급여·비급여 등의 산정 내용을 확인한다. 검사·주사·약제·처치·재료 등 어떤 항목의 비용인지 구분하고 약관의 보상대상·제외사항 등과 대조하기 위해 필요할 수 있다. 영수증은 비용의 큰 구분과 정산, 세부내역은 그 비용의 구성이라는 차이가 있다.","같은 환자·기관·진료 기간으로 영수증과 맞춰 읽는다. 비용이 산정되었다고 실제 납부까지 모두 확인되는 것은 아니며, 항목 코드가 질병코드를 뜻하지도 않는다. 세부내역에 처치가 적혀 있다는 사실만으로 수술비나 진단비가 확정되는 것은 아니다."]},{"heading":"진단서 · 의사가 어떤 질병·상태로 판단했는가","paragraphs":["의사가 진찰·검사 등에 근거해 판단한 진단 내용을 기재하는 문서다. 진단명과 질병분류코드, 진단 시점, 치료 내용·의견 등 해당 서식과 기재 내용을 확인한다. 진단비에서는 계약이 정한 질병 정의와 진단확정 요건을 검토하는 핵심 자료가 될 수 있다.","진단서 발급일, 최초 진료일, 검사일, 진단확정일은 서로 다를 수 있다. 확정진단인지 의심 단계인지도 확인한다. 진단서에 특정 코드가 있다는 이유만으로 모든 담보 요건을 충족하는 것은 아니며 병리·영상·혈액검사 등 근거 자료가 필요할 수 있다.","통원 실손 등에서는 회사의 안내와 청구 내용에 따라 진단명이 있는 처방전·통원확인서 등으로 대체하거나 일부 서류를 생략할 수 있다. 모든 청구에 유료 진단서를 먼저 발급받기보다 대체 가능한 문서와 필수 기재사항을 먼저 문의한다."]},{"heading":"수술확인서와 수술기록지 · 무엇을 언제 어떻게 시행했는가","paragraphs":["수술확인서는 시행한 수술명·수술일과 관련 진단 등 수술 사실을 확인하는 자료다. 회사가 요구하는 진단명·코드·수술명·날짜 등의 기재 여부를 살핀다. 서류 명칭은 의료기관에 따라 다를 수 있으므로 필요한 정보가 들어 있는지가 중요하다.","수술 방법·부위·범위가 확인서만으로 불명확하면 수술기록지가 필요할 수 있다. 수술기록지는 실제 시행 과정과 방법을 더 구체적으로 확인하는 자료다. 수술확인서라는 이름이 붙었다고 계약상 수술 정의·분류·지급횟수 등 조건이 자동 충족되는 것은 아니다. 진단서 등에 필요한 수술 정보가 모두 있는 경우 대체 가능한지는 보험회사에 확인한다."]},{"heading":"입퇴원확인서 · 언제부터 언제까지 입원했는가","paragraphs":["입원일·퇴원일과 입원 기간을 확인하는 자료다. 입원 관련 담보나 입원 실손의 진료 범위를 확인하는 데 필요할 수 있다. 진단명이 포함되는지는 문서에 따라 다르므로 회사가 요구하는 기재사항을 확인한다.","입원 기간이 적힌 진단서 등으로 대체할 수 있는지는 청구 안내를 확인한다. 입퇴원확인서는 입원 사실과 기간을 확인하는 자료이지만 약관상 입원 요건이나 치료 필요성을 모두 설명하지는 않는다. 필요한 경우 경과기록·검사·처치·간호기록 등을 추가로 검토할 수 있다. 입원일당의 인정 일수도 단순 날짜 차이만으로 확정하지 않고 약관을 확인한다."]},{"heading":"통원확인서·처방전·약제비 영수증 · 방문과 처방, 조제를 구분하기","paragraphs":["통원확인서나 진료확인서는 방문일·진료 내용 등을 확인하는 자료로 쓰인다. 진단명과 코드가 항상 모두 들어 있는 것은 아니므로 필요한 내용이 기재되어 있는지 확인한다. 통원일을 확인하는 자료와 그날 지출을 증명하는 영수증은 역할이 다르다.","처방전은 어떤 약을 어떤 용법·기간으로 처방했는지 확인하는 자료이며 진단명·질병코드 등 병명 확인 정보를 살필 수 있다. 다만 처방전만으로 실제 조제와 약값 납부가 증명되는 것은 아니다. 약제비 계산서·영수증은 약국의 조제 비용과 부담 내역 등을 확인하는 자료다. 병원 진료비와 약국 비용을 나누어 준비하되 해당 계약의 통원·처방 기준을 확인한다."]},{"heading":"병리·영상·검사결과지와 소견서 · 진단의 근거와 경과는 무엇인가","paragraphs":["병리보고서는 조직·세포 검사의 판독 내용을, 영상 판독지는 영상에서 관찰된 소견을, 혈액 등 검사결과지는 측정 결과를 보여준다. 약관에서 요구하는 진단확정 방법과 실제 근거를 연결하는 데 필요할 수 있다. 영상 소견이나 검사 수치 한 줄을 곧바로 최종 질병 진단으로 바꾸어 읽지 않는다.","의사소견서는 상태·치료 필요성·경과 등에 관한 의학적 판단을 설명하는 자료이고, 진료기록은 증상·진찰·검사·치료가 시간에 따라 기록된 자료다. 진단서와 소견서는 용도와 기재 내용이 다를 수 있어 언제나 서로 대체되는 것은 아니다. 추가 자료 요청을 받으면 어떤 사실 확인에 필요한지와 제출 범위를 문의한다."]},{"heading":"청구서·동의·본인확인 자료 · 누가 무엇을 청구하는가","paragraphs":["보험금청구서는 청구인과 대상 사고·질병, 진료 내용, 지급계좌 등 접수에 필요한 정보를 전달한다. 개인정보 처리 등 동의는 청구 심사에 필요한 정보 처리 절차와 관련되며, 진단이나 치료를 증명하는 의료서류와는 역할이 다르다. 모바일 접수에서는 일부 항목을 화면 입력·전자 동의로 처리할 수 있으므로 종이 양식이 항상 필요한 것은 아니다.","본인확인, 수익자·가족관계, 대리 청구의 권한 확인이 필요한 경우 신분확인 자료·관계 증명·위임 자료 등이 추가될 수 있다. 사고 청구라면 사고 경위와 사실을 확인하는 자료가 필요할 수 있다. 앱·서면 등 접수 경로와 청구 관계에 맞는 최신 안내를 확인하고 필요한 자료를 공식 접수 경로로 제출한다."]},{"heading":"가상 사례 · 입원 수술 후 실손·수술비·입원일당을 함께 청구한다면","paragraphs":["가상의 환자 민지 씨가 입원 중 수술을 받고 퇴원했다. 실손의료비를 검토하려면 진료비 영수증으로 비용 구분·납부를, 세부산정내역서로 비용 항목을 확인한다. 수술비는 수술명·날짜·관련 진단과 필요시 실제 방법을, 입원일당은 입원 기간과 해당 약관의 입원 요건을 확인해야 한다.","민지 씨가 수술확인서와 입퇴원확인서를 모두 발급받아야 하는지는 이미 가진 진단서 등에 필요한 내용이 있는지, 보험회사가 대체를 허용하는지에 따라 확인한다. 수술 방법 확인이 필요한 경우 수술기록지가 추가될 수 있다. 별도 진단비도 청구한다면 해당 질병의 최종 진단과 확정 근거를 따로 검토한다. 서류를 제출했다는 사실만으로 각 담보의 지급이 확정되지는 않는다."]},{"heading":"실무 질문 · 발급 창구에 가기 전에 확인하기","paragraphs":["보험회사에는 “제가 청구할 담보는 무엇이며, 확인할 사실과 필수 기재사항은 무엇인가요? 이미 있는 서류로 대체할 수 있나요? 추가 자료는 어떤 사실 확인을 위해 필요한가요?”라고 묻는다. 의료기관에는 확인받은 기재사항과 진료 범위를 정확하게 전달한다.","의료서류는 실제 진료와 의학적 판단을 정확히 반영해야 한다. 지급에 유리하도록 진단명이나 사실을 임의 변경하도록 요청하지 않는다. 이 장의 사례는 교육용이며 청구서류의 접수 요건과 보험금의 지급 요건은 구분한다."]}],"question":"① 영수증과 세부내역서는 각각 무엇을 확인하는가? ② 입퇴원확인서만으로 입원의 치료 필요성까지 모두 증명되는가? ③ 처방전만으로 약값 납부를 확인할 수 있는가? ④ 모든 청구에서 진단서·수술확인서·입퇴원확인서를 전부 발급받아야 하는가?","answer":"① 영수증은 비용 구분·환자 부담·납부 내역, 세부내역서는 항목별 산정 내용을 확인한다. ② 아니다. 기간 외의 약관상 요건이나 필요성은 진료기록 등을 검토할 수 있다. ③ 아니다. 처방과 실제 조제·납부는 구분하고 약제비 영수증 등을 확인한다. ④ 아니다. 회사·상품·청구 내용에 따라 필요한 정보, 대체·생략 가능 여부가 다르므로 발급 전에 확인한다.","references":["https://direct.samsungfire.com/claim/healthreward/health_doc.html","https://www.hi.co.kr/serviceAction.do?menuId=100631","https://www.kbinsure.co.kr/hompy/62/CG604010304.ec","https://epostlife.go.kr/PYIMRD0002.do","https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=285513"]},"1-6-4":{"sections":[{"heading":"학습 목표 · 문서에 적힌 날짜의 역할을 구분하기","paragraphs":["암진단비의 지급사유와 보장 조건을 검토할 때에는 진단서를 언제 발급받았는지보다 해당 계약이 정한 방법으로 언제 암이 진단확정되었는지가 중요하다. 그러나 진단확정일을 모든 계약에서 동일한 날짜로 정할 수는 없다. 가입한 약관의 진단확정 방법과 시점 문구를 먼저 확인하고 실제 의학적 근거와 연결한다.","이 장은 제3장의 청구서류 읽기에서 이어지는 날짜 판독 연습이다. 발급일을 확정일로 바꾸어 읽는 오류와, 모든 경우에 결과보고일이 정답이라고 단정하는 오류를 함께 피하는 것이 목표다."]},{"heading":"다섯 날짜 · 채취·보고·설명·발급·청구","paragraphs":["검체 채취일은 조직 등을 채취한 날이다. 병리 결과보고일은 검사를 거쳐 판독 결과가 보고된 시점과 관련된다. 검체를 얻었다는 사실과 암을 확정할 근거가 갖추어졌다는 사실은 구분해야 한다.","환자에게 결과를 설명한 날은 진료실 등에서 설명이 이루어진 날이다. 진단서 발급일은 문서를 발급한 날, 보험금 청구일은 보험회사에 청구한 날이다. 이 날짜들은 실제 진료에서 다를 수 있으며, 환자가 알게 된 날이나 서류를 출력한 날을 곧바로 약관상 진단확정일로 놓지 않는다."]},{"heading":"약관 확인 · 누가, 무엇으로, 어느 시점에 확정하는가","paragraphs":["공개된 암 관련 약관 중에는 전문의 자격과 조직·미세바늘흡인·혈액검사 등의 근거를 정하고 진단확정 시점을 해당 검사 결과보고 시점으로 명시한 사례가 있다. 이는 해당 약관 구조를 보여주는 예이며 다른 시기·상품·담보에 그대로 적용할 공통 규칙이라는 뜻은 아니다.","확인할 항목은 진단 주체, 인정 검사와 소견, 확정 시점 문구, 통상적인 진단 방법이 가능하지 않을 때의 예외 규정이다. 약관에 결과보고 시점이 명시되어 있다면 그 문구와 진단을 충족하는 실제 보고 내용을 대조한다. 병리보고서에 적힌 아무 날짜나 선택하거나 주치의 설명일을 자동 적용하지 않는다."]},{"heading":"병리보고서 읽기 · 검사 날짜와 최종 내용 연결하기","paragraphs":["병리보고서는 검체의 특성과 검사 소견, 진단 등을 담는 자료다. 검체 채취·접수·보고와 출력·발급 날짜가 함께 있으면 각각의 의미를 구분하고 최종 진단 및 보고 이력을 확인한다. 기관마다 날짜의 표시 방식이 다르므로 뜻이 불명확한 칸은 의료기관에 문의한다.","추가 염색·검사 결과나 추가·정정 보고가 있는 경우 무엇이 달라졌는지 살펴본다. 이미 확정된 진단에 치료 관련 정보를 보탠 것인지, 최초에는 확정되지 않았던 진단이 추가 검사로 확정된 것인지, 기존 판단이 수정된 것인지가 다를 수 있다. 가장 늦은 보고일을 무조건 새 진단일로 정하지 않는다."]},{"heading":"가상 사례 · 3월 7일 보고, 3월 20일 진단서 발급","paragraphs":["가상의 환자 하늘 씨는 3월 2일 검체를 채취했고 3월 7일 최종 병리 결과가 보고되었다. 3월 10일 의사의 설명을 듣고 3월 20일 청구용 진단서를 발급받았다. 여기서는 가입 약관이 결과보고 시점을 기준으로 정하고, 3월 7일 보고로 해당 담보의 진단확정 요건이 충족되었다고 가정한다.","이 가정에서 검토할 기준일은 3월 7일이다. 검체 채취일인 3월 2일, 결과를 들은 3월 10일, 진단서를 발급받은 3월 20일로 옮겨 판단하지 않는다. 진단서를 늦게 발급하거나 재발급받았다는 사실만으로 기존 진단확정 시점이 뒤로 이동하지 않는다. 이 사례는 모든 계약에서 3월 7일을 인정한다는 결론이나 실제 보험금 지급 약속이 아니다."]},{"heading":"날짜를 찾은 다음 · 보장개시와 감액 등 조건 확인","paragraphs":["확인한 진단확정 시점을 해당 담보의 보장개시일, 감액기간, 계약 상태 등과 대조한다. 각 기간의 시작·종료 계산과 예외는 실제 계약 문구로 확인해야 하며 모든 암 종류와 모든 가입자에게 같은 대기기간이나 감액률을 적용하지 않는다.","확정 시점이 보장 조건의 경계에 가깝다면 원본 기록과 적용 약관을 정리해 확인한다. 서류 발급이나 결과 설명을 늦추어 보장 조건을 맞추는 방식으로 안내하지 않는다. 날짜가 확인되어도 암의 정의·분류와 다른 지급요건을 충족하는지는 별도 검토가 필요하다."]},{"heading":"특별한 상황 · 진단 방법이 어렵거나 기록이 다른 경우","paragraphs":["병리학적 진단이 가능하지 않은 경우 등에 관한 예외 규정이 있는지는 가입 약관에서 확인한다. 단순히 검사를 하지 않았다는 사실만으로 예외가 자동 인정되지는 않는다. 해당 방법이 어려운 의학적 이유와 진단·치료를 뒷받침하는 기록 등 필요한 근거를 확인한다.","진단서와 병리보고서의 날짜가 다르면 하나를 임의로 고르기보다 각각 무엇을 표시하는지 확인한다. 잘못 기재된 정보의 정정과 실제 진단 내용의 변경도 구분한다. 기존·정정 문서와 이유를 함께 보존하고, 유리한 날짜로 바꾸기 위한 수정을 요청하지 않는다."]},{"heading":"보험 실무 · 사실표를 만든 뒤 확인 요청하기","paragraphs":["상담 자료는 날짜 / 발생한 사실 / 근거 문서 / 약관상 의미의 네 칸으로 정리한다. 검사·최종 보고·결과 설명·진단서 발급·청구를 구분하면 “진단서에는 20일이 적혔으니 20일이 기준”이라는 오해를 줄일 수 있다.","보험회사에는 “이 담보의 확정 시점 조항은 무엇인가요? 어느 보고서의 어떤 결과가 진단요건을 충족했다고 판단했나요?”라고 묻는다. 의료기관에는 보고일의 의미, 최종·추가·정정 여부와 진단 내용 등 사실관계를 확인한다. 의학적 사실과 계약 해석을 나누어 설명한다."]},{"heading":"핵심 요약 · 가입 약관 → 진단 근거 → 확정 시점 → 보장 조건","paragraphs":["기준은 진단서에 찍힌 발급일 자체가 아니라 가입 약관의 진단확정 기준과 실제 근거다. 결과보고 시점을 정한 약관에서는 그 조건을 충족하는 보고를 확인한다. 설명일·발급일·청구일을 임의로 대신 쓰지 않고, 시점 확인 후 보장개시와 감액 등 계약 조건을 대조한다."]}],"question":"가상 사례에서 검체 채취 3/2, 최종 결과보고 3/7, 환자 설명 3/10, 진단서 발급 3/20이다. 약관은 결과보고 시점을 기준으로 하고 3/7 보고로 진단요건을 충족했다고 가정한다. ① 검토 기준일은? ② 발급을 늦추면 기준일도 바뀌는가? ③ 이 결론을 모든 계약에 그대로 적용할 수 있는가?","answer":"① 이 가정에서는 3/7이다. ② 아니다. 문서 발급만 늦추거나 재발급받았다는 사실로 확정 시점이 바뀌지 않는다. ③ 아니다. 실제 가입 약관의 주체·검사·시점·예외 문구와 최종·추가·정정 기록을 확인해야 한다. 날짜 확인만으로 보장 조건과 모든 지급요건이 충족되는 것도 아니다.","references":["https://www.samsungfire.com/publication/pdf/ZPB369040_0_20260101_file1.pdf?_v=202601100034","https://www.cancer.gov/about-cancer/diagnosis-staging/diagnosis/pathology-reports-fact-sheet","https://jifi.scourt.go.kr/portal/news/NewsViewAction.work?gubun=4&searchOption=&searchWord=&seqnum=7342"]},"1-6-5":{"sections":[{"heading":"학습 목표 · 어디서 진료받았는지와 무엇을 받았는지 연결하기","paragraphs":["외래·입원·응급실은 진료가 이루어지는 경로와 상황을 이해하는 출발점이다. 그러나 장소나 머문 시간만으로 비용과 민영보험 지급이 모두 결정되지는 않는다. 실제 진료 내용, 건강보험 비용 산정, 가입 담보의 지급요건을 구분해서 확인한다.","이 장은 진료 경로를 영수증·세부내역·진료기록과 연결하는 연습이다. 같은 질병이라도 검사·처치·병실·기관 등이 다르면 비용이 달라질 수 있으므로, 청구서류의 진료 기간과 비용 범위를 먼저 맞춘다."]},{"heading":"외래 · 진찰 뒤 검사·처방·추적 방문으로 이어지는 흐름","paragraphs":["외래는 접수와 진찰 뒤 필요한 검사·처치·처방 등을 받고 귀가하거나 추후 방문으로 이어지는 흐름으로 이해할 수 있다. 모든 진료가 같은 순서로 진행되는 것은 아니며, 평가 결과에 따라 입원이나 다른 기관 진료로 연결될 수도 있다.","상담에서는 방문일별로 실제 시행한 항목과 비용을 확인한다. 처방전을 받았다는 사실과 약국에서 실제 조제·납부했다는 사실은 다르므로 병원 영수증과 약제비 영수증의 범위를 구분한다. 통원 횟수·공제·한도 등은 실제 가입 약관으로 확인한다."]},{"heading":"입원 · 입원 결정부터 병동 치료와 퇴원까지","paragraphs":["입원 진료는 의료진의 판단에 따른 입원 결정, 병동에서의 검사·치료·간호와 경과 관찰, 퇴원 계획 등으로 이어진다. 입원 기간에는 여러 진료 항목이 누적될 수 있으므로 입퇴원확인서의 기간과 영수증·세부내역의 포함 범위를 맞춰 읽는다.","병실 이용, 식대, 검사·약제·수술·처치 등의 산정 내용과 급여·비급여 구분을 살핀다. 환자부담이 모든 항목에 같은 비율로 적용된다고 가정하지 않는다. 중간 정산액이 퇴원 시 최종 총액에 포함되어 있는지도 확인해 두 번 더하지 않는다."]},{"heading":"응급실 · 중증도 평가 뒤 귀가·관찰·입원·전원으로 나뉜다","paragraphs":["응급실은 접수 순서만이 아니라 환자 상태와 중증도에 따른 우선순위로 진료가 이루어질 수 있다. 평가·검사·치료 후에는 상태에 따라 귀가, 관찰, 병동 입원 또는 다른 의료기관으로의 전원 등이 결정될 수 있다. 진료 중 상태에 따라 계획이 바뀔 수도 있다.","응급실 기록에서는 내원·퇴실 시각, 평가와 분류, 검사·처치, 이후 진료 경로를 확인한다. 응급실에 방문했다는 사실과 해당 비용 산정 또는 특정 담보가 정한 응급환자 요건을 충족했다는 판단은 구별한다. 분류와 비용 기준은 진료 당시 적용 기준으로 확인한다."]},{"heading":"비용이 달라지는 이유 · 질병명 하나로 금액을 예측하지 않기","paragraphs":["같은 질병명이라도 시행한 검사·처치·약제, 의료기관의 종류, 병실, 건강보험 적용 기준과 환자 자격·적용 제도 등에 따라 부담이 달라질 수 있다. 응급실도 기관의 구분, 환자 분류와 실제 진료 상황 등 관련 산정 조건을 함께 확인해야 한다.","비용이 높다는 이유만으로 더 중증이라고 판단하거나, 입원은 언제나 외래보다 환자 부담이 적다고 안내하지 않는다. 영수증의 급여 본인부담·공단부담·급여 전액본인부담·비급여를 나누고, 실제 항목과 정산 내역으로 차이를 설명한다."]},{"heading":"응급실에 오래 있었다면 입원일까? · 시간 하나로 단정하지 않기","paragraphs":["응급실에 오래 체류했거나 자정을 넘겼다는 사실만으로 입원 또는 입원일당 지급을 확정할 수 없다. 응급실 관찰과 병동 입원 경로, 입원 결정과 진료 내용, 비용 산정 방식, 해당 담보의 입원 정의를 구분해 살펴본다. 병상을 이용했다는 사실만으로도 결론을 낼 수 없다.","심평원의 응급실 본인부담 안내에는 기관·환자 분류·진료 구역 등 조건에 따라 산정 방식이 달라지는 사례가 제시되어 있다. 따라서 체류시간만으로 건강보험의 입원 본인부담 방식이 항상 적용된다고 설명하지 않는다. 반대로 건강보험상 산정 구분만으로 민영보험의 입원 요건까지 자동 충족된다고 판단해서도 안 된다."]},{"heading":"세 가지 판단 · 진료 사실, 건강보험 산정, 민영보험 약관","paragraphs":["첫째, 진료 사실은 어디서 언제 어떤 평가·검사·치료가 이루어졌는지를 묻는다. 둘째, 건강보험 산정은 어떤 기준으로 비용과 본인부담이 계산되었는지를 묻는다. 셋째, 민영보험은 실제 가입한 담보의 정의·보상범위·제외사항·공제·한도 등 요건을 충족하는지를 묻는다.","세 판단은 서로 관련되지만 같은 질문은 아니다. 영수증의 입원·외래 표시나 입퇴원확인서는 중요한 자료이지만 약관상 판단에 필요한 사실을 모두 대신하지는 못할 수 있다. 실손의료비, 입원일당, 응급실 관련 담보를 각각 확인한다."]},{"heading":"가상 사례 · 응급실에서 검사 후 병동으로 입원한 지훈 씨","paragraphs":["가상의 환자 지훈 씨는 야간에 응급실에서 평가와 검사를 받고, 의료진의 판단으로 병동에 입원해 치료한 뒤 퇴원했다. 상담에서는 응급실 내원·검사·입원 결정·병동 치료·퇴원까지 사실표로 정리한다. 이 경로 자체만으로 특정 진단이나 보험금 지급을 확정하지 않는다.","자료는 응급실 진료기록, 입퇴원확인서, 해당 진료 범위의 영수증과 세부내역 등을 목적에 맞춰 준비한다. 응급실 비용이 병원 최종 정산에 포함되었는지 확인하고 응급실 영수증과 최종 총액을 그대로 더하지 않는다. 전원했다면 의료기관별 자료와 기간을 구분한다.","실손은 실제 부담 비용과 보상 조건을, 입원일당은 입원 사실·기간과 약관상 요건을, 응급실 관련 담보는 그 담보의 대상과 요건을 따로 확인한다. 필요한 서류와 대체 가능 여부는 발급 전에 보험회사에 문의한다."]},{"heading":"핵심 요약 · 경로 → 기록 → 비용 → 약관","paragraphs":["진료 경로를 파악한다 → 실제 진료기록과 기간을 맞춘다 → 비용 산정과 납부 범위를 확인한다 → 가입 담보별 지급요건을 대조한다. 외래·입원·응급실이라는 이름 하나나 머문 시간 하나로 비용과 보험금 결론을 대신하지 않는다."]}],"question":"① 응급실에서 자정을 넘기거나 오래 머물면 입원일당이 자동 지급되는가? ② 건강보험에서 입원 본인부담 방식으로 산정되면 민영보험 입원요건도 항상 충족하는가? ③ 응급실 영수증과 퇴원 최종 영수증을 함께 받으면 두 총액을 그대로 더해도 되는가?","answer":"① 아니다. 실제 진료 경로·입원 결정·기록과 가입 담보의 요건을 확인한다. ② 아니다. 건강보험 비용 산정과 민영보험 지급요건을 구분한다. ③ 아니다. 최종 정산의 포함 범위를 확인해 중복 합산을 피한다.","references":["https://gj.dumc.or.kr/main/contents.do?idx=5943","https://www.hira.or.kr/bbsDummy.do?brdBltNo=47802&brdScnBltNo=4&pgmid=HIRAA010006011400","https://www.hira.or.kr/bbsDummy.do?brdBltNo=47801&brdScnBltNo=4&pgmid=HIRAA010006011000","https://www.nhis.or.kr/static/html/wbma/c/wbmac0103.html","https://direct.samsungfire.com/claim/healthreward/health_doc.html"]},"1-6-6":{"sections":[{"heading":"실습 목표 · 다섯 장의 지식을 하나의 사례로 연결하기","paragraphs":["제6부에서는 비용의 급여·비급여 구분, 영수증과 세부내역서, 청구서류의 역할, 진단과 발급 날짜, 외래·입원·응급실의 흐름을 배웠다. 마지막 장에서는 같은 사건을 진료 사실 → 비용과 정산 → 서류와 날짜 → 가입 담보 → 청구와 결과 확인 순서로 정리한다.","아래 인물·날짜·비용은 모두 교육용 가정이다. 실제 수가나 본인부담률, 특정 질병의 통상 치료과정 또는 보험금 지급액을 제시하는 사례가 아니다. 실제 청구는 가입 계약과 진료 당시 기록, 보험회사의 최신 안내를 확인한다."]},{"heading":"사례 제시 · 4월 1일 응급실에서 시작한 진료","paragraphs":["가상의 환자 유진 씨는 4월 1일 응급실에서 평가와 검사를 받고 의료진의 판단으로 병동에 입원했다. 4월 2일 수술을 받고 4월 4일 퇴원했으며, 4월 8일 청구용 서류를 발급받았다고 가정한다. 여기서는 특정 질병명이나 수술의 약관상 분류, 지급결론을 미리 정하지 않는다.","첫 과제는 날짜 / 발생한 사실 / 근거 문서의 표를 만드는 것이다. 응급실 진료와 병동 입원을 연결하되 입원 시작·종료와 실제 치료는 기록으로 확인한다. 4월 8일은 서류를 발급한 날이며 수술일이나 진단확정일로 바꾸어 쓰지 않는다. 진단확정 시점은 해당 담보의 약관 문구와 실제 진단 근거를 따로 확인한다."]},{"heading":"과제 1 · 전체 진료비와 환자 부담 계산하기","paragraphs":["최종 정산에 공단부담금 70만원, 급여 본인부담금 20만원, 급여 전액본인부담금 2만원, 비급여 8만원이 표시되었다고 가정한다. 전체 진료비는 70 + 20 + 2 + 8 = 100만원이고, 환자부담총액은 20 + 2 + 8 = 30만원이다. 공단부담금 70만원을 환자 지출에 다시 더하지 않는다.","급여 전액본인부담 2만원과 비급여 8만원은 환자가 전액 부담한다는 점만으로 같은 분류로 합치지 않는다. 영수증의 해당 칸을 구분하고 세부내역에서 실제 항목과 적용 범위를 확인한다. 이 숫자는 산술 연습이며 어느 치료가 실제로 이 분류와 금액에 해당한다는 설명이 아니다."]},{"heading":"과제 2 · 중간 납부를 두 번 더하지 않기","paragraphs":["유진 씨가 중간에 10만원을 납부했고, 할인·지원·환불·미납 등 다른 조정이 없다고 가정한다. 퇴원 시 이번 납부액은 환자부담총액 30만원에서 이미 낸 10만원을 뺀 20만원이다. 전체 환자 지출은 10 + 20 = 30만원이다.","중간 영수증 10만원과 최종 환자부담총액 30만원을 더해 지출을 40만원으로 계산하면 중간 금액을 중복 반영한다. 응급실 비용이 병원 최종 정산에 포함되었는지, 다른 기관 자료가 섞이지 않았는지, 환불이나 추가 정정이 있었는지도 실제 서류로 확인한다."]},{"heading":"과제 3 · 서류를 증명할 사실에 연결하기","paragraphs":["비용과 납부는 진료비 계산서·영수증으로, 비용의 구성은 세부산정내역서로 확인한다. 수술의 명칭·날짜·관련 진단은 수술확인서 등으로, 방법·범위가 불명확하면 수술기록지로 확인할 수 있다. 입원 기간은 입퇴원확인서 등에서 확인하되 약관상 입원 요건에 필요한 기록은 별도로 검토한다.","진단서와 검사결과는 진단 내용과 근거를 확인하는 데 사용한다. 서류 이름만으로 필요한 정보가 모두 들어 있다고 생각하지 말고 진단명·코드·날짜·수술명·입원 기간 등 해당 청구의 필수 기재사항을 확인한다. 서류 발급 전에 기존 자료의 대체·생략 가능 여부를 보험회사에 문의한다.","자료는 같은 환자·기관·진료 기간에 맞추어 정리한다. 문서 발급일과 진료·수술·진단 시점을 구분하며, 날짜나 진단이 정정되었다면 기존 문서와 정정 이유를 함께 보관한다. 지급에 유리하게 사실관계를 바꾸도록 요청하지 않는다."]},{"heading":"과제 4 · 한 사건도 담보별로 나누어 검토하기","paragraphs":["유진 씨가 실손의료비·수술비·입원일당에 가입해 있다고 가정하자. 실손은 실제 부담 비용 가운데 보상대상인지와 공제·한도·제외사항 등을 확인한다. 환자가 30만원을 냈다는 정보만으로 보험금이 30만원이라고 계산할 수 없다. 다른 실손 계약이 있다면 해당 계약의 중복 보상 관련 조건도 확인한다.","수술비는 실제 시행한 수술이 가입 담보의 수술 정의·분류·지급조건에 맞는지 확인한다. 입원일당은 입원 사실·기간뿐 아니라 약관상 입원 요건과 인정 기간 등을 확인한다. 이 실습은 수술비 금액이나 인정 입원일수를 임의로 정하지 않는다.","별도 진단비가 있다면 해당 질병의 정의와 진단확정 방법·시점 및 보장 조건을 추가 검토한다. 실손에서 비용이 보상된다는 사실이 곧 수술비·진단비 지급을 뜻하거나 그 반대가 되는 것은 아니다. 각 담보의 결론과 근거를 나누어 적는다."]},{"heading":"과제 5 · 접수와 추가 요청, 결과 확인까지 이어가기","paragraphs":["제출할 자료와 접수 경로는 보험회사의 최신 안내로 확인한다. 청구 내용·계좌·필요한 동의와 본인확인 등을 점검하고 공식 경로로 접수한다. 모바일에서는 일부 내용을 화면 입력과 전자 동의로 처리할 수 있으므로 종이 양식을 무조건 중복 준비하지 않는다. 접수번호와 제출 자료의 사본을 보관한다.","접수되었다는 사실과 지급이 확정되었다는 사실은 다르다. 추가 자료를 요청받으면 어떤 사실 확인에 필요한지, 필요한 기간과 항목은 무엇인지 문의한다. 이미 낸 서류로 확인 가능한지와 대체 자료가 있는지도 확인하고 접수 내역을 관리한다.","결과가 안내되면 청구한 담보별로 지급·부지급 사유와 산정내역을 대조한다. 실손의 보상대상 비용과 공제·한도, 정액 담보의 인정 조건 등 설명이 불명확하면 적용 약관 조항과 확인한 사실을 문의한다. 필요한 경우 담당 창구나 공식 민원 절차를 확인하되 서류 한 장만으로 결론을 단정하지 않는다."]},{"heading":"고객 설명 연습 · 확인한 사실과 남은 판단을 나누기","paragraphs":["“현재 서류상 전체 진료비는 100만원이고 환자부담총액은 30만원입니다. 중간에 낸 10만원을 반영하면 이번 납부는 20만원입니다. 수술과 입원 기록은 별도로 확인했고, 보험금은 실손·수술비·입원일당 각각의 약관으로 검토해야 합니다”처럼 설명한다.","추가 확인이 필요하다면 “아직 확인할 것은 실제 수술 방법과 해당 담보의 분류입니다. 먼저 기존 확인서로 충분한지 확인하고 필요할 때 기록을 준비하겠습니다”라고 구체적으로 안내한다. 지급 가능성, 예상, 확정을 섞지 않는 것이 목표다."]},{"heading":"제6부 마무리 · 사실 → 비용 → 서류 → 약관","paragraphs":["진료의 흐름을 사실로 정리하고, 비용의 분류와 정산을 확인하며, 필요한 사실에 맞춰 서류를 준비한다. 날짜와 문서의 의미를 정확히 읽은 뒤 담보별로 검토하고 접수·결과까지 확인한다. 다음 제7부에서는 보험약관과 담보를 읽는 기본 구조를 이어서 학습한다."]}],"question":"① 사례의 전체 진료비와 환자부담총액은 각각 얼마인가? ② 중간 납부 10만원을 반영한 이번 납부액과 전체 환자 지출은? ③ 4/8 서류 발급일을 수술일이나 진단확정일로 써도 되는가? ④ 환자부담 30만원이면 실손보험금도 30만원인가? ⑤ 서류가 접수되면 모든 담보 지급이 확정되는가?","answer":"① 전체 100만원, 환자부담총액 30만원이다. ② 이번 납부 20만원, 전체 지출 30만원이다. 최종 총액에 중간 납부를 다시 더하지 않는다. ③ 아니다. 실제 수술일은 사례상 4/2이며 진단확정 시점은 약관과 근거로 확인한다. ④ 이 정보만으로 확정할 수 없다. 보상대상·공제·한도 등 조건을 확인한다. ⑤ 아니다. 담보별 지급요건과 심사 결과를 확인해야 한다.","references":["https://direct.samsungfire.com/claim/healthreward/health_doc.html","https://www.samsungfire.com/da/manual/claim/M_P05_03_00_00.html","https://www.hi.co.kr/serviceAction.do?menuId=100411","https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=285513"]},"1-7-1":{"sections":[{"heading":"제7부의 출발점 · 진료 사실을 어떤 계약과 대조할까?","paragraphs":["제6부에서는 진료 사실과 비용, 서류를 정리했다. 제7부에서는 그 사실을 대조할 보험계약의 조건을 읽는다. 첫 단계는 상품 이름이나 질병명만으로 결론을 내리지 않고 실제 가입 담보와 적용되는 문서를 찾는 것이다.","보험증권은 자신의 계약 내용을 확인하는 출발점이고, 보험약관은 보장과 계약의 조건을 구체적으로 살펴보는 자료다. 청약서·계약 변경 문서 등 관련 자료가 필요할 수도 있다. 문서마다 역할이 다르므로 한 장만 보고 전체 계약을 단정하지 않는다."]},{"heading":"보험증권 · 내가 무엇에 가입했는지 찾는 출발점","paragraphs":["보험증권에서 정확한 상품명, 계약일, 계약자·피보험자·수익자 등 계약 관계, 가입한 담보명, 보험가입금액, 보험기간과 납입기간 등 표시 내용을 확인한다. 증권의 구성과 명칭은 상품에 따라 다르므로 필요한 정보가 어디에 기재되어 있는지 살핀다.","최초 증권만으로 현재 상태를 모두 알 수 없는 경우도 있다. 갱신·전환·담보 추가나 삭제 등 변경이 있었다면 현재 가입 내역과 관련 문서를 대조한다. 증권의 가입금액을 모든 상황의 실제 지급액으로 보지 말고 해당 담보의 지급사유와 산정 조건을 확인한다."]},{"heading":"보통약관 · 공통 조건과 기본적인 권리·의무 읽기","paragraphs":["보통약관은 해당 상품의 기본적인 계약 조건과 공통 사항을 정하는 기본 약관으로 이해할 수 있다. 지급·청구, 계약의 성립·유지·변경·해지 등 계약 관계를 다루는 내용이 포함될 수 있다. 실제 구성은 상품에 따라 확인한다.","보통약관과 기본계약을 무조건 같은 한 가지 의미로 사용하지 않는다. 기본계약이 어떤 보장을 뜻하는지와 보통약관에서 공통으로 정하는 사항은 해당 상품 구조에 맞춰 읽는다. 생명보험 등에서 주계약·특약이라는 명칭을 사용하는 경우도 있으므로 목차와 용어 해설부터 확인한다."]},{"heading":"특별약관 · 담보별 보장과 특별한 조건 확인하기","paragraphs":["특별약관은 보통약관에 정한 사항 외에 선택한 보장이나 특별한 조건 등 필요한 사항을 별도로 정한 약관이다. 수술비·진단비·입원 관련 보장 등의 지급사유와 정의, 지급 제한 등을 담을 수 있으며 모든 특별약관이 추가 보장만을 뜻하는 것은 아니다.","약관집에는 선택 가능한 여러 특별약관이 함께 실릴 수 있다. 책에 암진단비나 수술비 특약이 있다고 자신이 모두 가입한 것은 아니다. 증권과 실제 가입 내역에서 담보를 확인하고 정확한 이름의 특별약관으로 연결한다. 이름이 비슷한 담보도 범위와 조건이 다를 수 있다."]},{"heading":"준용 · 다른 조항을 함께 적용하도록 연결하는 문구","paragraphs":["준용은 해당 조항만으로 정하지 않은 내용 등에 관해 다른 조항을 함께 적용하도록 연결하는 방식으로 이해하면 쉽다. 예를 들어 어떤 특약에 정하지 않은 사항은 보통약관을 따르도록 정했다면, 실제로 어느 조항을 준용하고 제외하는지 확인해야 한다.","특약에 직접 정한 내용과 보통약관을 연결해 읽되, “특약은 언제나 모든 조항보다 우선한다”는 한 문장으로 모든 문제를 해결하려 하지 않는다. 서로 다른 내용처럼 보이면 특별 규정·예외·준용 범위와 관련 문구를 전체 맥락에서 확인한다. 해석이 불명확하면 보험회사에 적용 조항과 판단 근거를 문의한다."]},{"heading":"정의·별표·제외사항 · 지급사유 한 문장에서 멈추지 않기","paragraphs":["지급사유에서 암·수술·입원 등의 용어를 찾았다면 그 담보의 정의와 진단확정 방법, 별표의 질병·수술 분류 등 연결된 내용을 읽는다. 같은 일상 용어라도 약관의 정의가 다를 수 있다. 질병코드나 수술명 하나가 지급결론을 대신하지 않는다.","보험금을 지급하지 않는 사유, 보장개시와 감액, 한도와 지급횟수, 갱신이나 종료 관련 조건 등은 필요한 조항에서 함께 확인한다. 별표에 포함된다는 사실과 모든 지급요건을 충족한다는 판단도 구별한다. 구체적인 조건은 다음 장들에서 차례로 다룬다."]},{"heading":"적용 판본 · 최신 약관이 내 계약의 약관은 아닐 수 있다","paragraphs":["약관을 찾을 때는 정확한 상품명과 가입 시기, 담보명과 관련 계약 정보를 기준으로 한다. 공시실의 현재 판매 약관을 과거 계약에 그대로 적용하지 않는다. 보험회사에 자신에게 적용되는 약관과 관련 변경 자료를 요청할 수 있다.","갱신·전환·변경이 있었다면 어떤 조항이 어느 시점부터 적용되는지 해당 계약 문서로 확인한다. 갱신했다는 이유만으로 모든 내용이 최신 약관으로 바뀌었다고 가정하거나, 반대로 최초 약관만 영원히 적용된다고 단정하지 않는다. 자료의 이름·적용 시기·확인한 출처를 기록한다."]},{"heading":"가상 사례 · 같은 수술비라는 말에서 정확한 담보로 이동하기","paragraphs":["가상의 고객 은서 씨가 수술 후 두꺼운 약관집을 펼쳤다. 약관집에는 여러 종류의 수술비 특약과 암진단비 특약이 함께 있지만, 실제 가입 여부와 범위는 아직 확인하지 않았다고 하자. 우선 현재 증권과 가입 내역에서 정확한 담보명을 찾는다.","해당 수술비 특약을 찾은 뒤 실제 수술 기록과 약관의 수술 정의·분류를 연결하고, 지급 제외사항·금액 산정·횟수·기간과 준용 조항 등을 함께 확인한다. 암 특약이 책에 있다는 사실만으로 암진단비 가입을 인정하거나, 가입금액 숫자만 보고 지급액을 확정하지 않는다.","요약 이미지의 예시 증권에 표시한 금액과 기간도 문서 읽기를 위한 가상 표기다. 실제 상품이나 고객의 보장 내용이 아니며 예시 금액의 지급을 약속하지 않는다. 이 장에서는 어떤 수술에 얼마가 지급되는지까지 임의로 정하지 않는다."]},{"heading":"실무 정리 · 문서에서 근거까지 한 줄로 남기기","paragraphs":["상담 기록은 가입 담보명 / 적용 약관과 시기 / 확인한 조항·별표 / 진료 사실 / 추가 확인 사항으로 정리한다. 고객에게는 “현재 가입 내역에서 확인한 담보는 ○○이고, 관련 특약에서는 △△를 확인해야 합니다”처럼 근거와 남은 질문을 나누어 설명한다.","상품설명서와 안내자료는 이해를 돕지만 요약만으로 구체적 지급결론을 내리지 않는다. 설명자료와 계약 문서가 다르게 보이면 해당 부분과 설명 경위를 정리해 확인한다. 약관집 한 문장만으로 관련 법령이나 설명·계약 내용의 쟁점까지 모두 판단하려 하지 않는다."]},{"heading":"핵심 요약 · 증권 → 적용 약관 → 담보 조항 → 정의·별표·예외","paragraphs":["보험증권과 변경 내역으로 실제 가입 담보를 찾는다. 적용 약관을 확인한 다음 해당 특약의 지급사유와 연결된 정의·별표·제외사항·준용을 읽는다. 내 계약의 보장 범위와 지급조건은 관련 문서를 연결해서 확인하는 것이 출발점이다."]}],"question":"① 약관집에 암진단비 특약이 실려 있으면 가입한 것으로 보아도 되는가? ② 보통약관 준용 문구가 있는 특약은 특약 한 페이지만 읽으면 충분한가? ③ 증권에 적힌 가입금액이 항상 실제 지급액인가? ④ 과거 계약에 현재 판매 약관을 그대로 적용해도 되는가?","answer":"① 아니다. 증권과 실제 가입 내역에서 확인한다. ② 아니다. 어떤 조항을 준용하고 제외하는지 연결해 읽는다. ③ 아니다. 지급사유와 산정 조건 등을 확인해야 한다. ④ 아니다. 정확한 상품·가입 시기·갱신·전환·변경 자료로 적용 판본과 조건을 확인한다.","references":["https://www.kidi.or.kr/user/nd5469.do","https://www.samsungfire.com/publication/pdf/ZPB415070_0_20261012_file1.pdf","https://www.easylaw.go.kr/CSP/CnpClsMain.laf?ccfNo=2&cciNo=1&cnpClsNo=2&csmSeq=2588&popMenu=ov","https://www.cardif.co.kr/customer-center/보험-약관-증권.do"]},"1-7-2":{"sections":[{"heading":"학습 목표 · 보장 문장을 끝까지 읽기","paragraphs":["제1장에서 실제 가입 담보와 적용 약관을 찾았다면, 이번에는 그 담보가 어떤 경우에 보험금을 지급하는지 읽는다. 지급사유, 용어의 정의, 지급하지 않는 사유, 세부규정과 예외를 연결해야 한다. 담보 제목이나 지급사유 한 문장만으로 지급·부지급을 단정하지 않는다.","이 장의 읽기 순서는 사실관계와 조항을 비교하기 위한 학습 도구다. 모든 보험상품의 조항 순서가 같다는 뜻이나 분쟁에서의 입증책임을 일률적으로 정하는 설명이 아니다. 실제 계약과 관련 법령·사실관계의 쟁점은 구분해 확인한다."]},{"heading":"지급사유 · 누가 언제 어떤 상태나 행위에 해당하는가?","paragraphs":["지급사유는 보험금을 지급할 대상으로 정한 사건과 요건을 설명하는 조항이다. 문장을 누가 / 어느 기간에 / 어떤 질병·상태·행위에 해당할 때 / 어떤 방식으로 지급하는지로 나누어 읽으면 빠뜨리는 조건을 줄일 수 있다.","예를 들어 진단비라면 어떤 질병의 진단확정인지, 수술비라면 어떤 수술인지, 입원 관련 담보라면 어떤 입원인지 연결된 정의를 확인한다. 같은 수술비라는 이름이라도 해당 질병이나 수술 범위, 횟수·금액 산정 등은 계약마다 다를 수 있다."]},{"heading":"정의와 별표 · 일상 표현을 약관의 뜻과 대조하기","paragraphs":["의료기관에서 수술·시술·입원이라고 표현한 사실은 중요한 자료지만, 약관에서 정한 정의와 언제나 같은 범위라는 뜻은 아니다. 해당 담보의 정의, 진단확정 방법, 연결된 질병·수술 분류표와 실제 진료기록을 대조한다.","진단명·질병코드나 처치 항목 하나만으로 보장 범위를 확정하지 않는다. 별표에 포함되는지뿐 아니라 어떤 상태·방법·범위를 뜻하는지, 지급사유에 추가 조건이 있는지도 살핀다. 다만 정의가 맞지 않는다고 결론 내리려면 실제 기록과 해당 문구를 정확히 확인해야 한다."]},{"heading":"지급하지 않는 사유 · 제외 문구와 사실을 연결하기","paragraphs":["지급하지 않는 사유 또는 보상하지 않는 손해 등으로 표시된 조항은 해당 계약에서 보장하지 않는 경우를 정한다. 담보 자체의 제외사항뿐 아니라 보통약관 등에서 준용하는 관련 조항도 확인한다. 다른 담보의 제외 문구를 그대로 가져와 적용하지 않는다.","조항을 찾았다면 어떤 행위·원인·상태를 제외하는지, 실제 사건이 그 조건에 해당하는지, 단서나 예외가 있는지 함께 읽는다. 비슷한 단어가 보인다는 이유만으로 적용을 단정하거나 예외 문구를 생략하지 않는다. 이 장에서는 특정 치료가 언제나 보장되거나 제외된다는 공통 목록을 만들지 않는다."]},{"heading":"세부규정 · 횟수·금액·기간을 함께 확인하기","paragraphs":["지급에 관한 세부규정에는 지급횟수, 한도, 동일 사건·동일 질병의 처리, 금액 산정이나 다른 담보와의 관계 등 필요한 조건이 정해질 수 있다. 보장개시·감액·계약 상태 등은 관련 조항에서 함께 확인한다. 각 항목이 어디에 있는지는 상품마다 다를 수 있다.","지급사유에 해당해 보인다고 증권의 가입금액이 그대로 지급된다고 안내하지 않는다. 반대로 지급액의 감액·공제나 한도 문제를 모두 전액 부지급과 같은 뜻으로 설명하지 않는다. 보장 여부와 금액 산정은 연결되어 있지만 구분해서 설명할 대상이다."]},{"heading":"세 가지 검토 · 요건, 제외, 미확인을 구별하기","paragraphs":["첫째는 지급사유와 정의에 해당하는지의 검토다. 둘째는 관련 제외 조항과 예외가 적용되는지의 검토다. 셋째는 아직 어느 사실이 확인되지 않았는지의 정리다. 첫째와 둘째는 각각 확인할 질문이며 셋째의 미확인은 검토 중인 상태이므로 서로 같은 결론처럼 쓰지 않는다.","서류가 불명확하다는 사실 자체를 곧바로 면책 사유라고 부르지 않는다. 추가 자료를 요청받았다고 부지급이 확정된 것도 아니다. 확인된 사실, 미확인 사항, 실제 판단 근거를 분리한다. 자료가 부족한 상황의 실제 처리 절차와 판단은 해당 계약 및 안내를 확인한다."]},{"heading":"가상 사례 · 수술확인서가 있지만 방법이 불명확하다면?","paragraphs":["가상의 고객 도윤 씨가 수술확인서를 제출했고 실제 가입한 수술비 특약도 확인되었다고 가정한다. 다만 확인서의 수술명만으로는 실제 방법과 범위를 충분히 알 수 없으며, 어떤 특약의 수술 정의·분류에 해당하는지도 아직 검토 중이다.","이때 “수술확인서가 있으니 지급 확정”이라고 말하지 않는다. “자세한 기록이 없으니 면책”이라고 결론 내리지도 않는다. 먼저 적용 특약의 정의·분류와 관련 제외·예외 문구를 확인하고, 어떤 사실이 필요한지 정리한 뒤 수술기록지 등 기존 자료로 확인할 수 있는지 살핀다.","방법과 범위가 확인되면 실제 사실을 조항과 대조하고, 지급횟수·금액·기간 등 다른 조건도 검토한다. 지급하지 않는 사유를 적용한다는 안내가 있다면 해당 문구와 어떤 사실을 연결했는지 확인한다. 이 사례는 특정 수술에 대한 지급 또는 부지급 결론을 제시하지 않는다."]},{"heading":"고객 설명 · 사실 → 적용 조항 → 남은 질문","paragraphs":["고객 설명은 “현재 확인된 사실은 ○○이고, 가입 담보의 △△ 조항에서 □□를 확인해야 합니다. 아직 불명확한 것은 ◇◇이며 이를 확인할 자료는 ▽▽입니다”처럼 구성한다. 지급 가능성이나 예상과 실제 확정 안내를 구분한다.","지급 제한이나 제외가 안내되면 담보명, 적용 조항, 확인된 사실과 판단 근거를 요청한다. 금액 문제라면 계산 내역도 함께 확인한다. 설명이 불명확하거나 사실이 다르게 반영되었다면 관련 자료를 정리해 담당 창구에 문의하고 필요시 공식 이의·민원 절차를 확인한다."]},{"heading":"핵심 요약 · 실제 담보 → 지급사유·정의 → 제외·예외 → 세부조건","paragraphs":["제외 조항에서 찾지 못했다고 자동 지급되는 것은 아니다. 반대로 사실이 아직 불명확하다고 자동 면책되는 것도 아니다. 실제 가입 담보의 전체 조건과 사실을 연결하고, 확인한 근거와 아직 필요한 질문을 분리해 기록한다."]}],"question":"① 어떤 사건이 제외 조항에 없으면 무조건 지급되는가? ② 수술확인서가 있으면 해당 수술비 특약의 지급이 확정되는가? ③ 수술 방법을 확인하려고 추가 기록을 요청받으면 부지급이 확정된 것인가? ④ 일부 감액·공제와 전액 부지급을 같은 뜻으로 설명해도 되는가?","answer":"① 아니다. 지급사유·정의와 다른 조건도 충족하는지 확인한다. ② 아니다. 실제 수술 내용과 약관의 정의·분류·제외·예외 및 세부조건을 대조한다. ③ 아니다. 확인이 필요한 사실과 요청 목적을 구분한다. 자료 부족 자체를 면책 사유와 혼동하지 않는다. ④ 아니다. 보장 여부와 지급액 산정의 문제를 구분해 설명한다.","references":["https://www.kidi.or.kr/user/nd5469.do","https://www.samsungfire.com/publication/pdf/ZPB445010_0_20260413_file1.pdf?_v=202604120048","https://m.easylaw.go.kr/MOB/CsmInfoRetrieve.laf?ccfNo=2&cciNo=1&cnpClsNo=2&csmSeq=2588","https://direct.samsungfire.com/claim/healthreward/health_doc.html"]}},"revision_note":"제7부 제2장 지급사유·제외·정의·세부조건 읽기 신규 집필","public_image_chapters":["1-1-1","1-5-1","1-1-2","1-1-3","1-1-4","1-1-5","1-1-6","1-2-1","1-2-2","1-2-3","1-2-4","1-2-5","1-2-6","1-3-1","1-3-2","1-3-3","1-3-4","1-3-5","1-3-6","1-4-1","1-4-2","1-4-3","1-4-4","1-4-5","1-4-6","1-5-2","1-5-3","1-5-4","1-5-5","1-5-6","1-6-1","1-6-2","1-6-3","1-6-4","1-6-5","1-6-6","1-7-1","1-7-2"],"image_notes":{"1-5-1":"기존에 제작한 원본 요약 이미지입니다. 이미지 안의 KCD-8 표기는 제작 당시 기준이며, 적용 판본은 위 학습본문과 공식 분류 자료에서 확인해 주세요.","1-1-4":"이 원본 그림은 이전 제작본에서 제3장으로 표기되어 있습니다. 현재 교재 목차에서는 폐·호흡기를 제4장으로 분류하며, 제3장은 뇌·신경입니다. 그림의 호흡기 내용은 이 제4장 본문과 함께 읽어 주세요.","1-6-1":
